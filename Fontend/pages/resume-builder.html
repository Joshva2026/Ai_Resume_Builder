<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder — ResumeForge</title>
<!-- Fonts dynamically injected based on selection, Inter as default -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="dynamicGoogleFont" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Styles -->
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/app-shell.css">
<link rel="stylesheet" href="../css/builder.css">
<link rel="stylesheet" href="../css/animations.css">
</head>
<body>

<div id="appShellRoot"></div>

<template id="builderTemplate">
  <div class="builder-toolbar">
    <button class="btn btn-ghost btn-sm" id="btnBackTop"><i class="fa-solid fa-arrow-left"></i> Back</button>
    <input type="text" class="title-input" id="resumeTitle" value="Untitled Resume" aria-label="Resume title">
    <div class="toolbar-actions">
      <span class="save-indicator" id="saveIndicator"><span class="dot"></span> Saved</span>
      <button class="btn btn-ghost btn-sm" id="btnHistory"><i class="fa-solid fa-clock-rotate-left"></i> Versions</button>
      <a href="ats-checker.html" class="btn btn-ghost btn-sm"><i class="fa-solid fa-gauge-high"></i> ATS Score</a>
      <button class="btn btn-ghost btn-sm" id="btnUndo"><i class="fa-solid fa-undo"></i> Undo</button>
      <button class="btn btn-primary btn-sm" id="btnDownload"><i class="fa-solid fa-download"></i> PDF</button>
      <button class="btn btn-primary btn-sm" id="btnSave">Save</button>
      <button class="btn btn-ghost btn-sm" id="btnRetry" style="display:none">Retry</button>
    </div>
  </div>

  <div class="progress-container">
    <div class="progress-bar" id="wizardProgress" style="width: 8%;"></div>
  </div>

  <div class="builder-layout">

    <!-- Editor Pane (Accordion layout) -->
    <section class="editor-pane">
      
      <!-- Resume Tier -->
      <div class="editor-section-card active" data-section="type">
        <div class="editor-section-header" onclick="toggleAccordion('type')">
          <div class="icon-group"><i class="fa-solid fa-layer-group"></i> Resume Tier</div>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="editor-section-content">
          <p class="sub">Select your experience level to structure section order.</p>
          <div style="display:flex; gap:var(--sp-3)">
            <button class="btn btn-primary" id="btnFresher" style="flex:1; padding:var(--sp-4)">Entry Level (Fresher)</button>
            <button class="btn btn-ghost" id="btnExperienced" style="flex:1; padding:var(--sp-4)">Experienced Professional</button>
          </div>
        </div>
      </div>

      <!-- Personal Info Section -->
      <div class="editor-section-card" data-section="personal">
        <div class="editor-section-header" onclick="toggleAccordion('personal')">
          <div class="icon-group"><i class="fa-solid fa-user"></i> Personal Information</div>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="editor-section-content">
          <div class="field-row">
            <div class="field"><label>Full name</label><input type="text" id="f_fullName" placeholder="Jane Doe"></div>
            <div class="field"><label>Professional title</label><input type="text" id="f_headline" placeholder="Web Developer"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Email</label><input type="email" id="f_email" placeholder="jane@email.com"></div>
            <div class="field"><label>Phone</label><input type="tel" id="f_phone" placeholder="+1 555 000 0000"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Location</label><input type="text" id="f_location" placeholder="New York, NY"></div>
            <div class="field"><label>LinkedIn URL</label><input type="text" id="f_link" placeholder="linkedin.com/in/janedoe"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>GitHub / Portfolio</label><input type="text" id="f_github" placeholder="github.com/janedoe"></div>
          </div>
        </div>
      </div>

      <!-- Career Summary Section -->
      <div class="editor-section-card" data-section="summary">
        <div class="editor-section-header" onclick="toggleAccordion('summary')">
          <div class="icon-group"><i class="fa-solid fa-file-invoice"></i> Professional Summary</div>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="editor-section-content">
          <div class="field">
            <label>Summary</label>
            <textarea id="f_summary" rows="5" placeholder="Goal-oriented professional with a strong foundation..."></textarea>
            <button class="ai-inline-btn" data-ai="summary"><i class="fa-solid fa-wand-magic-sparkles"></i> Improve with AI</button>
          </div>
        </div>
      </div>

      <!-- Work Experience Section -->
      <div class="editor-section-card" data-section="experience">
        <div class="editor-section-header" onclick="toggleAccordion('experience')">
          <div class="icon-group"><i class="fa-solid fa-briefcase"></i> Work Experience</div>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="editor-section-content">
          <div id="experienceBlocks"></div>
          <button class="btn btn-ghost btn-sm" id="addExperience" style="margin-top:var(--sp-2)"><i class="fa-solid fa-plus"></i> Add Position</button>
        </div>
      </div>

      <!-- Education Section -->
      <div class="editor-section-card" data-section="education">
        <div class="editor-section-header" onclick="toggleAccordion('education')">
          <div class="icon-group"><i class="fa-solid fa-graduation-cap"></i> Education</div>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="editor-section-content">
          <div id="educationBlocks"></div>
          <button class="btn btn-ghost btn-sm" id="addEducation" style="margin-top:var(--sp-2)"><i class="fa-solid fa-plus"></i> Add Education</button>
        </div>
      </div>

      <!-- Projects Section -->
      <div class="editor-section-card" data-section="projects">
        <div class="editor-section-header" onclick="toggleAccordion('projects')">
          <div class="icon-group"><i class="fa-solid fa-diagram-project"></i> Featured Projects</div>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="editor-section-content">
          <div id="projectBlocks"></div>
          <button class="btn btn-ghost btn-sm" id="addProject" style="margin-top:var(--sp-2)"><i class="fa-solid fa-plus"></i> Add Project</button>
        </div>
      </div>

      <!-- Skills Section -->
      <div class="editor-section-card" data-section="skills">
        <div class="editor-section-header" onclick="toggleAccordion('skills')">
          <div class="icon-group"><i class="fa-solid fa-sliders"></i> Skills Inventory</div>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="editor-section-content">
          <div class="field">
            <label>Skills (comma separated)</label>
            <textarea id="f_skills" rows="3" placeholder="JavaScript, CSS, REST APIs, Agile, Problem Solving"></textarea>
            <button class="ai-inline-btn" data-ai="keywords"><i class="fa-solid fa-wand-magic-sparkles"></i> Optimize Keywords</button>
          </div>
        </div>
      </div>

      <!-- Certifications Section -->
      <div class="editor-section-card" data-section="certifications">
        <div class="editor-section-header" onclick="toggleAccordion('certifications')">
          <div class="icon-group"><i class="fa-solid fa-certificate"></i> Certifications</div>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="editor-section-content">
          <div class="field">
            <label>Certifications (one per line)</label>
            <textarea id="f_certs" rows="3" placeholder="AWS Cloud Practitioner (2024)"></textarea>
          </div>
        </div>
      </div>

      <!-- Languages Section -->
      <div class="editor-section-card" data-section="languages">
        <div class="editor-section-header" onclick="toggleAccordion('languages')">
          <div class="icon-group"><i class="fa-solid fa-language"></i> Languages</div>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="editor-section-content">
          <div id="languageBlocks"></div>
          <button class="btn btn-ghost btn-sm" id="addLanguage" style="margin-top:var(--sp-2)"><i class="fa-solid fa-plus"></i> Add Language</button>
        </div>
      </div>

      <!-- Volunteer Work Section -->
      <div class="editor-section-card" data-section="volunteer">
        <div class="editor-section-header" onclick="toggleAccordion('volunteer')">
          <div class="icon-group"><i class="fa-solid fa-hand-holding-heart"></i> Volunteer Work</div>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="editor-section-content">
          <div id="volunteerBlocks"></div>
          <button class="btn btn-ghost btn-sm" id="addVolunteer" style="margin-top:var(--sp-2)"><i class="fa-solid fa-plus"></i> Add Volunteer Role</button>
        </div>
      </div>

      <!-- Awards Section -->
      <div class="editor-section-card" data-section="awards">
        <div class="editor-section-header" onclick="toggleAccordion('awards')">
          <div class="icon-group"><i class="fa-solid fa-trophy"></i> Awards & Honors</div>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="editor-section-content">
          <div id="awardBlocks"></div>
          <button class="btn btn-ghost btn-sm" id="addAward" style="margin-top:var(--sp-2)"><i class="fa-solid fa-plus"></i> Add Award</button>
        </div>
      </div>

      <!-- Publications Section -->
      <div class="editor-section-card" data-section="publications">
        <div class="editor-section-header" onclick="toggleAccordion('publications')">
          <div class="icon-group"><i class="fa-solid fa-book"></i> Publications</div>
          <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="editor-section-content">
          <div id="publicationBlocks"></div>
          <button class="btn btn-ghost btn-sm" id="addPublication" style="margin-top:var(--sp-2)"><i class="fa-solid fa-plus"></i> Add Publication</button>
        </div>
      </div>

    </section>

    <!-- Live preview panel (Center) -->
    <aside class="preview-pane">
      <div class="paper-scaler" id="paperScaler">
        <div class="paper" id="livePreview"></div>
      </div>
    </aside>

    <!-- Typography & Template Settings (Right Side) -->
    <aside class="preview-style-bar">
      <h3>Design Settings</h3>
      
      <div class="style-group">
        <label>Template Layout</label>
        <select id="selTemplate" aria-label="Select Template">
          <!-- 20 Templates added here -->
          <optgroup label="ATS-Friendly">
            <option value="classic-ats" selected>Classic ATS</option>
            <option value="minimal-ats">Minimal ATS</option>
            <option value="corporate-ats">Corporate ATS</option>
            <option value="clean-ats">Clean ATS</option>
            <option value="professional-ats">Professional ATS</option>
          </optgroup>
          <optgroup label="Modern">
            <option value="modern-professional">Modern Professional</option>
            <option value="modern-minimal">Modern Minimal</option>
            <option value="contemporary">Contemporary</option>
            <option value="clean-modern">Clean Modern</option>
          </optgroup>
          <optgroup label="Technical">
            <option value="technical">Technical</option>
            <option value="software-engineer">Software Engineer</option>
            <option value="developer">Developer</option>
            <option value="data-analytics">Data/Analytics</option>
            <option value="engineering">Engineering</option>
          </optgroup>
          <optgroup label="Fresher / Student">
            <option value="fresher">Fresher</option>
            <option value="graduate">Graduate</option>
            <option value="student-professional">Student Professional</option>
          </optgroup>
          <optgroup label="Executive">
            <option value="executive">Executive</option>
            <option value="senior-professional">Senior Professional</option>
            <option value="leadership">Leadership</option>
          </optgroup>
        </select>
      </div>

      <div class="style-group" style="margin-top:var(--sp-2);">
        <label>Typography Font</label>
        <select id="selFontFamily" aria-label="Select Font Family">
          <optgroup label="Sans-Serif">
            <option value="'Inter', sans-serif">Inter</option>
            <option value="'Arial', sans-serif">Arial</option>
            <option value="'Helvetica', sans-serif">Helvetica</option>
            <option value="'Roboto', sans-serif">Roboto</option>
            <option value="'Open Sans', sans-serif">Open Sans</option>
            <option value="'Lato', sans-serif">Lato</option>
            <option value="'Source Sans 3', sans-serif">Source Sans 3</option>
            <option value="'Nunito Sans', sans-serif">Nunito Sans</option>
            <option value="'IBM Plex Sans', sans-serif">IBM Plex Sans</option>
            <option value="'Work Sans', sans-serif">Work Sans</option>
            <option value="'DM Sans', sans-serif">DM Sans</option>
            <option value="'Manrope', sans-serif">Manrope</option>
          </optgroup>
          <optgroup label="Serif">
            <option value="'Times New Roman', serif">Times New Roman</option>
            <option value="'Georgia', serif">Georgia</option>
            <option value="'Merriweather', serif">Merriweather</option>
            <option value="'Libre Baskerville', serif">Libre Baskerville</option>
            <option value="'Source Serif 4', serif">Source Serif 4</option>
          </optgroup>
          <optgroup label="Monospace">
            <option value="'IBM Plex Mono', monospace">IBM Plex Mono</option>
            <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
          </optgroup>
        </select>
      </div>

      <div class="style-group" style="margin-top:var(--sp-2);">
        <label>Body Font Size <span id="lblFontSize" style="font-weight:normal;color:var(--ink-600)">10pt</span></label>
        <input type="range" id="rngFontSize" min="8" max="14" step="0.5" value="10">
      </div>

      <div class="style-group">
        <label>Heading Size <span id="lblHeadingSize" style="font-weight:normal;color:var(--ink-600)">14pt</span></label>
        <input type="range" id="rngHeadingSize" min="12" max="24" step="1" value="14">
      </div>
      
      <div class="style-group">
        <label>Subheading Size <span id="lblSubheadingSize" style="font-weight:normal;color:var(--ink-600)">11pt</span></label>
        <input type="range" id="rngSubheadingSize" min="10" max="16" step="0.5" value="11">
      </div>

      <div class="style-group" style="margin-top:var(--sp-2);">
        <label>Line Height <span id="lblLineHeight" style="font-weight:normal;color:var(--ink-600)">1.5</span></label>
        <input type="range" id="rngLineHeight" min="1.1" max="2.0" step="0.05" value="1.5">
      </div>

      <div class="style-group">
        <label>Section Spacing <span id="lblSectionSpacing" style="font-weight:normal;color:var(--ink-600)">12pt</span></label>
        <input type="range" id="rngSectionSpacing" min="4" max="24" step="1" value="12">
      </div>

      <div class="style-group">
        <label>Paragraph Spacing <span id="lblParagraphSpacing" style="font-weight:normal;color:var(--ink-600)">6pt</span></label>
        <input type="range" id="rngParagraphSpacing" min="0" max="16" step="1" value="6">
      </div>

      <div class="style-group" style="margin-top:var(--sp-2);">
        <label>Page Margins <span id="lblMargins" style="font-weight:normal;color:var(--ink-600)">20mm</span></label>
        <input type="range" id="rngMargins" min="10" max="35" step="1" value="20">
      </div>

    </aside>

  </div>

  <!-- Wizard Controls (Hidden navigation aids triggered from JS) -->
  <button id="btnNext" style="display:none"></button>

  <!-- Floating AI Suggestions Panel Toggle Button -->
  <button type="button" class="btn btn-primary" id="btnToggleSuggestions" style="display:none; position:fixed; bottom:24px; right:24px; z-index:1000; border-radius:50%; width:56px; height:56px; padding:0; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(124,58,237,0.3); border:none;">
    <i class="fa-solid fa-wand-magic-sparkles" style="font-size:20px;"></i>
  </button>

  <!-- Collapsible AI Suggestions Sidebar Panel -->
  <div class="ai-suggestions-sidebar" id="aiSuggestionsSidebar" style="display:none; position:fixed; top:80px; right:24px; bottom:24px; width:360px; background:var(--glass-bg); backdrop-filter:var(--glass-blur); border:1px solid var(--glass-border); border-radius:var(--radius-lg); box-shadow:var(--glass-shadow); z-index:999; flex-direction:column; overflow:hidden;">
    <div style="padding:16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:var(--paper-50);">
      <h4 style="margin:0; font-weight:800; display:flex; align-items:center; gap:8px; font-size:var(--fs-sm); color:var(--primary);"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Suggestions</h4>
      <button type="button" id="btnCloseSuggestions" style="background:none; border:none; color:var(--ink-600); cursor:pointer; font-size:14px;"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="aiSuggestionsContent" style="padding:16px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:16px; font-size:var(--fs-xs); line-height:1.4;">
      <!-- Populated from local storage -->
    </div>
    <div style="padding:12px 16px; border-top:1px solid var(--line); background:var(--paper-50); display:flex; justify-content:stretch;">
      <a href="ats-checker.html" class="btn btn-primary btn-sm btn-block" style="text-align:center; text-decoration:none; color:#fff; display:block; width:100%;"><i class="fa-solid fa-gauge-high"></i> Re-run ATS Score Check</a>
    </div>
  </div>
</template>

<script src="../js/services/api-service.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/components/app-shell.js"></script>
<script>
AppShell.render({ active: 'resume-builder', title: 'Resume Builder' });
const content = document.getElementById('appContent');
content.appendChild(document.getElementById('builderTemplate').content.cloneNode(true));

// Inline UI helper for accordion toggle
window.toggleAccordion = function(section) {
  const cards = document.querySelectorAll('.editor-section-card');
  cards.forEach(c => {
    if(c.dataset.section === section) {
      c.classList.add('active');
    } else {
      c.classList.remove('active');
    }
  });
};
</script>
<script src="../js/pages/resume-builder.js"></script>
<a href="../index.html" class="global-back-btn" aria-label="Back to Home" title="Back to Home"><i class="fa-solid fa-house"></i></a>
</body>
</html>
