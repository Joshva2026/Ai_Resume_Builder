<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder — ResumeForge</title>
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Styles -->
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/app-shell.css">
<link rel="stylesheet" href="../css/builder.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/templates.css">
</head>
<body>

<div id="appShellRoot"></div>

<template id="builderTemplate">
  <div class="builder-toolbar">
    <button class="btn btn-ghost btn-sm" id="btnBackTop"><i class="fa-solid fa-arrow-left"></i> Back</button>
    <input type="text" class="title-input" id="resumeTitle" value="Untitled Resume" aria-label="Resume title">
    <div class="toolbar-actions">
      <span class="save-indicator" id="saveIndicator"><span class="dot"></span> Saved</span>
      <button class="btn btn-ghost btn-sm" id="btnHistory"><i class="fa-solid fa-clock-rotate-left"></i> Versions</button>
      <a href="ats-checker.html" class="btn btn-ghost btn-sm"><i class="fa-solid fa-gauge-high"></i> ATS Score</a>
      <button class="btn btn-ghost btn-sm" id="btnUndo"><i class="fa-solid fa-undo"></i> Undo</button>
      <button class="btn btn-primary btn-sm" id="btnDownload"><i class="fa-solid fa-download"></i> PDF</button>
      <button class="btn btn-primary btn-sm" id="btnSave">Save</button>
      <button class="btn btn-ghost btn-sm" id="btnRetry" style="display:none">Retry</button>
    </div>
  </div>

  <div class="progress-container">
    <div class="progress-bar" id="wizardProgress" style="width: 8%;"></div>
  </div>

  <div class="builder-steps-nav">
    <div class="step-nav-item active" data-step="personal">
      <div class="step-icon"><i class="fa-solid fa-user"></i></div>
      <span>Personal</span>
    </div>
    <div class="step-nav-line"></div>
    <div class="step-nav-item" data-step="education">
      <div class="step-icon"><i class="fa-solid fa-graduation-cap"></i></div>
      <span>Education</span>
    </div>
    <div class="step-nav-line"></div>
    <div class="step-nav-item" data-step="experience">
      <div class="step-icon"><i class="fa-solid fa-briefcase"></i></div>
      <span>Experience</span>
    </div>
    <div class="step-nav-line"></div>
    <div class="step-nav-item" data-step="skills">
      <div class="step-icon"><i class="fa-solid fa-sliders"></i></div>
      <span>Skills</span>
    </div>
    <div class="step-nav-line"></div>
    <div class="step-nav-item" data-step="projects">
      <div class="step-icon"><i class="fa-solid fa-diagram-project"></i></div>
      <span>Projects</span>
    </div>
    <div class="step-nav-line"></div>
    <div class="step-nav-line"></div>
    <div class="step-nav-item" data-step="summary">
      <div class="step-icon"><i class="fa-solid fa-file-invoice"></i></div>
      <span>Summary</span>
    </div>
    <div class="step-nav-line"></div>
    <div class="step-nav-item" data-step="review">
      <div class="step-icon"><i class="fa-solid fa-list-check"></i></div>
      <span>Review</span>
    </div>
  </div>

  <!-- START SCREEN: Choose Resume Type -->
  <div id="startScreen" style="max-width:600px; margin:40px auto; background:var(--paper-0); padding:40px; border-radius:12px; box-shadow:var(--shadow-md); text-align:center;">
    <h2 style="margin-bottom:16px;">Choose Resume Type</h2>
    <p style="color:var(--ink-600); margin-bottom:32px;">Select your experience level to structure your resume sections optimally.</p>
    
    <div style="display:flex; gap:16px; margin-bottom:32px; justify-content:center;">
      <button class="btn btn-ghost" id="btnFresher" style="flex:1; padding:24px; flex-direction:column; gap:12px; height:auto; border:2px solid var(--line);">
        <i class="fa-solid fa-graduation-cap" style="font-size:32px;"></i>
        <span style="font-size:16px; font-weight:700;">Fresher</span>
        <span style="font-size:12px; font-weight:400; color:var(--ink-500);">Entry Level / Student</span>
      </button>
      <button class="btn btn-ghost" id="btnExperienced" style="flex:1; padding:24px; flex-direction:column; gap:12px; height:auto; border:2px solid var(--line);">
        <i class="fa-solid fa-briefcase" style="font-size:32px;"></i>
        <span style="font-size:16px; font-weight:700;">Professional</span>
        <span style="font-size:12px; font-weight:400; color:var(--ink-500);">Experienced</span>
      </button>
    </div>

    <button class="btn btn-primary" id="btnStartContinue" style="width:100%; padding:16px; font-size:16px;" disabled>Continue</button>
  </div>

  <div class="builder-layout" id="builderLayout" style="display:none;">
    <!-- Section rail -->
    <aside class="section-rail" id="sectionRail">
      <h4>Resume Sections</h4>
      <div class="rail-item" draggable="true" data-section="personal"><i class="fa-solid fa-grip-vertical grip"></i> Personal Info <i class="fa-solid fa-check rail-check" style="display:none"></i></div>
      <div class="rail-item" draggable="true" data-section="summary"><i class="fa-solid fa-grip-vertical grip"></i> Summary</div>
      <div class="rail-item" draggable="true" data-section="experience"><i class="fa-solid fa-grip-vertical grip"></i> Experience</div>
      <div class="rail-item" draggable="true" data-section="education"><i class="fa-solid fa-grip-vertical grip"></i> Education</div>
      <div class="rail-item" draggable="true" data-section="projects"><i class="fa-solid fa-grip-vertical grip"></i> Projects</div>
      <div class="rail-item" draggable="true" data-section="skills"><i class="fa-solid fa-grip-vertical grip"></i> Skills</div>
      <div class="rail-item" draggable="true" data-section="certifications"><i class="fa-solid fa-grip-vertical grip"></i> Certifications</div>
      <div class="rail-item" draggable="true" data-section="languages"><i class="fa-solid fa-grip-vertical grip"></i> Languages</div>
      <div class="rail-item" draggable="true" data-section="volunteer"><i class="fa-solid fa-grip-vertical grip"></i> Volunteer Work</div>
      <div class="rail-item" draggable="true" data-section="awards"><i class="fa-solid fa-grip-vertical grip"></i> Awards</div>
      <div class="rail-item" draggable="true" data-section="publications"><i class="fa-solid fa-grip-vertical grip"></i> Publications</div>
      <div class="rail-item" data-section="template" style="margin-top:var(--sp-4); border-top:1px solid var(--line); padding-top:var(--sp-3);"><i class="fa-solid fa-cubes" style="margin-right:8px; color:var(--primary);"></i> Choose Template</div>
      <div class="rail-item" data-section="review" style="margin-top:var(--sp-2);"><i class="fa-solid fa-list-check" style="margin-right:8px; color:var(--primary);"></i> Review & Finalize</div>

      <div class="rail-completion-box">
        <div class="circle-progress">
          <svg class="progress-ring" width="80" height="80">
            <circle class="progress-ring__background" stroke="var(--line)" stroke-width="6" fill="transparent" r="34" cx="40" cy="40"/>
            <circle class="progress-ring__circle" stroke="var(--primary)" stroke-width="6" fill="transparent" r="34" cx="40" cy="40" stroke-dasharray="213.6" stroke-dashoffset="213.6" id="completionCircle"/>
          </svg>
          <div class="circle-val" id="completionCircleVal">0%</div>
        </div>
        <div style="font-size:11px;font-weight:700;margin-top:8px;color:var(--ink-950);">Complete Profile</div>
      </div>
    </aside>

    <!-- Editor -->
    <section class="editor-pane">
      <!-- Personal Info Section -->
      <div class="editor-section active" data-section="personal">
        <h3>Personal Information</h3>
        <div class="field-row">
          <div class="field"><label>Full name</label><input type="text" id="f_fullName" placeholder="Jane Doe"></div>
          <div class="field"><label>Professional title</label><input type="text" id="f_headline" placeholder="Web Developer"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Email</label><input type="email" id="f_email" placeholder="jane@email.com"></div>
          <div class="field"><label>Phone</label><input type="tel" id="f_phone" placeholder="+1 555 000 0000"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Location</label><input type="text" id="f_location" placeholder="New York, NY"></div>
          <div class="field"><label>LinkedIn URL</label><input type="text" id="f_link" placeholder="linkedin.com/in/janedoe"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>GitHub URL</label><input type="text" id="f_github" placeholder="github.com/janedoe"></div>
          <div class="field"><label>Portfolio URL</label><input type="text" id="f_portfolio" placeholder="yourportfolio.com"></div>
        </div>
        <div class="field">
          <span style="font-size:var(--fs-2xs);color:var(--ink-500);display:block;padding:4px 0 8px;"><i class="fa-solid fa-circle-info" style="color:var(--primary);"></i> LinkedIn, GitHub &amp; Portfolio appear in contact info on all templates.</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:var(--sp-4)">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('btnBack').click()">Back</button>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('btnNext').click()">Continue</button>
        </div>
      </div>

      <!-- Career Summary Section -->
      <div class="editor-section" data-section="summary">
        <h3>Professional Summary</h3>
        <div class="field">
          <label>Summary</label>
          <textarea id="f_summary" rows="5" placeholder="Goal-oriented developer with a strong foundation in modern web development..."></textarea>
          <button class="ai-inline-btn" data-ai="summary"><i class="fa-solid fa-wand-magic-sparkles"></i> Improve with AI</button>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:var(--sp-4)">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('btnBack').click()">Back</button>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('btnNext').click()">Continue</button>
        </div>
      </div>

      <!-- Work Experience Section -->
      <div class="editor-section" data-section="experience">
        <h3>Work Experience</h3>
        <div id="experienceBlocks"></div>
        <button class="btn btn-ghost btn-sm" id="addExperience" style="margin-top:var(--sp-2)"><i class="fa-solid fa-plus"></i> Add Position</button>
        <div style="display:flex; justify-content:space-between; margin-top:var(--sp-4)">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('btnBack').click()">Back</button>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('btnNext').click()">Continue</button>
        </div>
      </div>

      <!-- Education Section -->
      <div class="editor-section" data-section="education">
        <h3>Education</h3>
        <div id="educationBlocks"></div>
        <button class="btn btn-ghost btn-sm" id="addEducation" style="margin-top:var(--sp-2)"><i class="fa-solid fa-plus"></i> Add Education</button>
        <div style="display:flex; justify-content:space-between; margin-top:var(--sp-4)">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('btnBack').click()">Back</button>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('btnNext').click()">Continue</button>
        </div>
      </div>

      <!-- Projects Section -->
      <div class="editor-section" data-section="projects">
        <h3>Featured Projects</h3>
        <div id="projectBlocks"></div>
        <button class="btn btn-ghost btn-sm" id="addProject" style="margin-top:var(--sp-2)"><i class="fa-solid fa-plus"></i> Add Project</button>
        <div style="display:flex; justify-content:space-between; margin-top:var(--sp-4)">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('btnBack').click()">Back</button>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('btnNext').click()">Continue</button>
        </div>
      </div>

      <!-- Skills Section -->
      <div class="editor-section" data-section="skills">
        <h3>Skills Inventory</h3>
        <div class="field">
          <label>General Skills (comma separated)</label>
          <textarea id="f_skills" rows="3" placeholder="JavaScript, CSS variables, REST APIs, Git, Responsive layouts"></textarea>
          <button class="ai-inline-btn" data-ai="keywords"><i class="fa-solid fa-wand-magic-sparkles"></i> Optimize Keywords</button>
        </div>
        <!-- Skill Categories (for Professional ATS Compact and similar templates) -->
        <div class="field" style="margin-top:var(--sp-3)">
          <label>Skill Categories <span style="font-size:var(--fs-2xs);color:var(--ink-500);font-weight:400">— optional, for categorized layouts</span></label>
          <div id="skillCategoryBlocks"></div>
          <button class="btn btn-ghost btn-sm" id="addSkillCategory" style="margin-top:var(--sp-2)"><i class="fa-solid fa-plus"></i> Add Skill Category</button>
        </div>
        <!-- Relevant Coursework (for Professional ATS Compact and fresher templates) -->
        <div class="field" style="margin-top:var(--sp-3)">
          <label>Relevant Coursework <span style="font-size:var(--fs-2xs);color:var(--ink-500);font-weight:400">— comma or newline separated</span></label>
          <textarea id="f_coursework" rows="3" placeholder="Data Structures, Algorithms, Machine Learning, Database Systems"></textarea>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:var(--sp-4)">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('btnBack').click()">Back</button>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('btnNext').click()">Continue</button>
        </div>
      </div>

      <!-- Certifications Section -->
      <div class="editor-section" data-section="certifications">
        <h3>Professional Certifications</h3>
        <div class="field">
          <label>Certifications (one per line)</label>
          <textarea id="f_certs" rows="3" placeholder="AWS Cloud Practitioner (2024)"></textarea>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:var(--sp-4)">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('btnBack').click()">Back</button>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('btnNext').click()">Continue</button>
        </div>
      </div>

      <!-- Languages Section -->
      <div class="editor-section" data-section="languages">
        <h3>Languages</h3>
        <div id="languageBlocks"></div>
        <button class="btn btn-ghost btn-sm" id="addLanguage" style="margin-top:var(--sp-2)"><i class="fa-solid fa-plus"></i> Add Language</button>
        <div style="display:flex; justify-content:space-between; margin-top:var(--sp-4)">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('btnBack').click()">Back</button>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('btnNext').click()">Continue</button>
        </div>
      </div>

      <!-- Volunteer Work Section -->
      <div class="editor-section" data-section="volunteer">
        <h3>Volunteer Work</h3>
        <div id="volunteerBlocks"></div>
        <button class="btn btn-ghost btn-sm" id="addVolunteer" style="margin-top:var(--sp-2)"><i class="fa-solid fa-plus"></i> Add Volunteer Role</button>
        <div style="display:flex; justify-content:space-between; margin-top:var(--sp-4)">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('btnBack').click()">Back</button>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('btnNext').click()">Continue</button>
        </div>
      </div>

      <!-- Awards Section -->
      <div class="editor-section" data-section="awards">
        <h3>Awards & Honors</h3>
        <div id="awardBlocks"></div>
        <button class="btn btn-ghost btn-sm" id="addAward" style="margin-top:var(--sp-2)"><i class="fa-solid fa-plus"></i> Add Award</button>
        <div style="display:flex; justify-content:space-between; margin-top:var(--sp-4)">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('btnBack').click()">Back</button>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('btnNext').click()">Continue</button>
        </div>
      </div>

      <!-- Publications Section -->
      <div class="editor-section" data-section="publications">
        <h3>Publications</h3>
        <div id="publicationBlocks"></div>
        <button class="btn btn-ghost btn-sm" id="addPublication" style="margin-top:var(--sp-2)"><i class="fa-solid fa-plus"></i> Add Publication</button>
        <div style="display:flex; justify-content:space-between; margin-top:var(--sp-4)">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('btnBack').click()">Back</button>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('btnNext').click()">Continue</button>
        </div>
      </div>

      <!-- Choose Template Section -->
      <div class="editor-section" data-section="template">
        <h3>Choose Resume Template</h3>
        <p style="margin-bottom:var(--sp-4); font-size:var(--fs-sm); color:var(--ink-600)">Select a professional layout to structure your resume dynamically. Changing template will not modify or reset your resume data.</p>
        
        <div class="templates-grid" id="editorTemplatesGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:16px; margin-bottom:var(--sp-4);">
          <!-- Populated by JS -->
        </div>

        <div style="display:flex; justify-content:space-between; margin-top:var(--sp-4)">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('btnBack').click()">Back</button>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('btnNext').click()">Continue</button>
        </div>
      </div>

      <!-- Final Review Section -->
      <div class="editor-section" data-section="review">
        <h3>Review & Finalize</h3>
        <p style="margin-bottom:var(--sp-4); font-size:var(--fs-sm); color:var(--ink-600)">Review your completeness before downloading or running an ATS scan.</p>
        
        <div id="completenessChecklist" style="background:var(--paper-50); border:1px solid var(--line); border-radius:var(--radius-md); padding:var(--sp-4); margin-bottom:var(--sp-4);">
          <!-- Populated by JS -->
        </div>

        <div style="display:flex; justify-content:space-between; margin-top:var(--sp-4)">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('btnBack').click()">Back</button>
          <button class="btn btn-primary" id="btnSaveBottom" style="flex:1; margin-left:var(--sp-3)"><i class="fa-solid fa-floppy-disk"></i> Save Resume</button>
        </div>
        <div style="margin-top:var(--sp-3)">
          <a href="ats-checker.html" class="btn btn-ghost" style="width:100%; text-align:center;"><i class="fa-solid fa-gauge-high"></i> Verify ATS Score</a>
        </div>
      </div>
      
    </section>

    <!-- Live preview panel with styling bar -->
    <aside class="preview-pane">
      <div class="preview-style-bar">
        <div class="style-group">
          <label><i class="fa-solid fa-file-invoice"></i> Template</label>
          <select id="selTemplate" aria-label="Select Template">
            <!-- Populated dynamically -->
          </select>
        </div>

        <div class="style-group">
          <label><i class="fa-solid fa-font"></i> Font Style</label>
          <select id="selFont" aria-label="Select Font">
            <option value="sans" selected>Sans-Serif (Inter)</option>
            <option value="serif">Serif (Georgia)</option>
            <option value="mono">Monospace (IBM Plex)</option>
          </select>
        </div>

        <div class="style-group">
          <label><i class="fa-solid fa-arrows-up-down"></i> Line Spacing</label>
          <input type="range" id="rngSpacing" min="1.1" max="1.8" step="0.1" value="1.4" aria-label="Line spacing slider">
        </div>

      </div>

      <div class="paper-container">
        <div class="paper" id="livePreview"></div>
      </div>
    </aside>
  </div>

  <!-- Wizard Controls (Hidden navigation aids triggered from JS) -->
  <button id="btnBack" style="display:none"></button>
  <button id="btnNext" style="display:none"></button>

  <!-- Floating AI Suggestions Panel Toggle Button -->
  <button type="button" class="btn btn-primary" id="btnToggleSuggestions" style="display:none; position:fixed; bottom:24px; right:24px; z-index:1000; border-radius:50%; width:56px; height:56px; padding:0; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(124,58,237,0.3); border:none;">
    <i class="fa-solid fa-wand-magic-sparkles" style="font-size:20px;"></i>
  </button>

  <!-- Collapsible AI Suggestions Sidebar Panel -->
  <div class="ai-suggestions-sidebar" id="aiSuggestionsSidebar" style="display:none; position:fixed; top:80px; right:24px; bottom:24px; width:360px; background:var(--glass-bg); backdrop-filter:var(--glass-blur); border:1px solid var(--glass-border); border-radius:var(--radius-lg); box-shadow:var(--glass-shadow); z-index:999; flex-direction:column; overflow:hidden;">
    <div style="padding:16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:var(--paper-50);">
      <h4 style="margin:0; font-weight:800; display:flex; align-items:center; gap:8px; font-size:var(--fs-sm); color:var(--primary);"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Suggestions</h4>
      <button type="button" id="btnCloseSuggestions" style="background:none; border:none; color:var(--ink-600); cursor:pointer; font-size:14px;"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="aiSuggestionsContent" style="padding:16px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:16px; font-size:var(--fs-xs); line-height:1.4;">
      <!-- Populated from local storage -->
    </div>
    <div style="padding:12px 16px; border-top:1px solid var(--line); background:var(--paper-50); display:flex; justify-content:stretch;">
      <a href="ats-checker.html" class="btn btn-primary btn-sm btn-block" style="text-align:center; text-decoration:none; color:#fff; display:block; width:100%;"><i class="fa-solid fa-gauge-high"></i> Re-run ATS Score Check</a>
    </div>
  </div>
  <!-- AI Summary Modal -->
  <div id="aiSummaryModal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(9,9,11,0.7); backdrop-filter:blur(6px); z-index:2000; align-items:center; justify-content:center; padding:var(--sp-4);">
    <div class="modal-card" style="width:100%; max-width:600px; background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-xl); max-height:85vh; display:flex; flex-direction:column; overflow:hidden; color:var(--ink-950);">
      <div class="modal-header" style="padding:var(--sp-4) var(--sp-5); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:var(--paper-50);">
        <h3 style="margin:0; font-size:var(--fs-md); font-weight:800; display:flex; align-items:center; gap:8px;"><i class="fa-solid fa-wand-magic-sparkles" style="color:var(--primary);"></i> AI Summary Improvement</h3>
        <button type="button" class="btn-close" id="closeAiSummaryModal" style="background:none; border:none; font-size:16px; color:var(--ink-600); cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="aiSummaryModalBody" style="padding:var(--sp-5); overflow-y:auto; flex:1; font-size:var(--fs-xs); line-height:1.5;">
        <div style="margin-bottom:var(--sp-4);">
          <strong style="color:var(--ink-600); display:block; margin-bottom:4px;">Original Summary</strong>
          <div id="aiSummaryOriginal" style="background:var(--paper-50); border:1px solid var(--line); padding:var(--sp-3); border-radius:var(--radius-sm); color:var(--score-mid); text-decoration:line-through;"></div>
        </div>
        <div>
          <strong style="color:var(--primary); display:block; margin-bottom:4px;">AI Improved Summary</strong>
          <div id="aiSummaryGenerated" style="background:var(--signal-50); border:1px solid var(--signal-200); padding:var(--sp-3); border-radius:var(--radius-sm); color:var(--ink-950); font-weight:500;"></div>
        </div>
      </div>
      <div class="modal-footer" style="padding:var(--sp-4) var(--sp-5); border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:12px; background:var(--paper-50);">
        <button type="button" class="btn btn-ghost" id="btnKeepOriginalSummary">Keep Original</button>
        <button type="button" class="btn btn-primary" id="btnApplyAiSummary"><i class="fa-solid fa-check"></i> Apply Improvement</button>
      </div>
    </div>
  </div>
