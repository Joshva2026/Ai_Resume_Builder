<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — ResumeForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/app-shell.css" />
  <style>
    .settings-panel { 
      max-width: 600px; 
      background: rgba(255, 255, 255, 0.03); 
      border: 1px solid var(--glass-border); 
      border-radius: 12px; 
      padding: 32px; 
      margin-top: 32px; 
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-shadow);
      color: #FFFFFF;
    }
    .settings-panel h3 { margin-bottom: 24px; font-size: var(--fs-lg); border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 12px; color: #FFFFFF; }
    .form-actions { margin-top: 24px; display: flex; gap: 16px; justify-content: flex-end; }
  </style>
</head>
<body>
  <div id="appShellRoot"></div>

  <template id="settingsTemplate">
    <div class="settings-panel">
      <h3>Profile Settings</h3>
      <form id="settingsForm">
        <div class="field">
          <label>First Name</label>
          <input type="text" id="setFirstName" placeholder="Jane" />
        </div>
        <div class="field">
          <label>Last Name</label>
          <input type="text" id="setLastName" placeholder="Doe" />
        </div>
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="setEmail" disabled />
          <p class="hint">Email address cannot be changed.</p>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </template>

  <a href="../index.html" class="global-back-btn" aria-label="Back to Home" title="Back to Home"><i class="fa-solid fa-house"></i></a>

  <script src="../js/services/api-service.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/components/app-shell.js"></script>
  <script src="../js/main.js"></script>
  <script>
    AppShell.render({ active: 'settings', title: 'Settings' });
    const content = document.getElementById('appContent');
    content.appendChild(document.getElementById('settingsTemplate').content.cloneNode(true));

    async function loadSettings() {
      try {
        const user = await ApiService.auth.me();
        document.getElementById('setFirstName').value = user.firstName || '';
        document.getElementById('setLastName').value = user.lastName || '';
        document.getElementById('setEmail').value = user.email || '';
      } catch(e) {
        console.error('Failed to load settings', e);
      }
    }
    loadSettings();

    document.getElementById('settingsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.textContent = 'Saving...';
      btn.disabled = true;

      try {
        await ApiService.profile.update({
          firstName: document.getElementById('setFirstName').value,
          lastName: document.getElementById('setLastName').value
        });
        showToast('Settings saved!', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.textContent = 'Save Changes';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
