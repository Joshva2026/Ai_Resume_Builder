<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Builder — ResumeForge</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/app-shell.css">
  <link rel="stylesheet" href="../css/portfolio.css">
</head>
<body class="app-body">
  
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">RF</span>
        <span class="brand-text">ResumeForge</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="resume-builder.html"><i class="fa-solid fa-file-lines"></i> Resume Builder</a>
        <a href="ats-checker.html"><i class="fa-solid fa-gauge-high"></i> ATS Checker</a>
        <a href="portfolio-builder.html" class="active"><i class="fa-solid fa-globe"></i> Portfolio Builder</a>
        <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">
          <h1>Portfolio Builder</h1>
          <span class="badge">Beta</span>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-outline" id="btnPreview"><i class="fa-solid fa-eye"></i> Preview</button>
          <button class="btn btn-primary" id="btnPublish"><i class="fa-solid fa-rocket"></i> Publish</button>
        </div>
      </header>

      <div class="portfolio-workspace">
        <div class="portfolio-editor">
          
          <div class="editor-section">
            <h3><i class="fa-solid fa-palette"></i> Theme Settings</h3>
            <div class="form-group">
              <label>Theme</label>
              <select id="themeSelect" class="form-control">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </div>
            <div class="form-group">
              <label>Accent Color</label>
              <input type="color" id="accentColor" value="#0ea5e9" class="form-control">
            </div>
          </div>

          <div class="editor-section">
            <h3><i class="fa-solid fa-user"></i> Hero Section</h3>
            <div class="form-group">
              <label>Name</label>
              <input type="text" id="heroName" class="form-control" placeholder="John Doe">
            </div>
            <div class="form-group">
              <label>Headline</label>
              <input type="text" id="heroHeadline" class="form-control" placeholder="Full Stack Developer">
            </div>
            <div class="form-group">
              <label>About Me</label>
              <textarea id="heroAbout" class="form-control" rows="4"></textarea>
            </div>
          </div>

          <div class="editor-section">
            <h3><i class="fa-solid fa-briefcase"></i> Projects</h3>
            <div id="projectsContainer"></div>
            <button class="btn btn-outline btn-block mt-2" id="btnAddProject"><i class="fa-solid fa-plus"></i> Add Project</button>
          </div>
          
          <div class="editor-section">
            <h3><i class="fa-solid fa-code"></i> Skills</h3>
            <div id="skillsContainer"></div>
            <button class="btn btn-outline btn-block mt-2" id="btnAddSkill"><i class="fa-solid fa-plus"></i> Add Skill</button>
          </div>

          <div class="editor-section">
            <h3><i class="fa-solid fa-briefcase"></i> Experience</h3>
            <div id="experienceContainer"></div>
            <button class="btn btn-outline btn-block mt-2" id="btnAddExperience"><i class="fa-solid fa-plus"></i> Add Experience</button>
          </div>

          <div class="editor-section">
            <h3><i class="fa-solid fa-graduation-cap"></i> Education</h3>
            <div id="educationContainer"></div>
            <button class="btn btn-outline btn-block mt-2" id="btnAddEducation"><i class="fa-solid fa-plus"></i> Add Education</button>
          </div>

          <div class="editor-section">
            <h3><i class="fa-solid fa-trophy"></i> Achievements & Certifications</h3>
            <div class="form-group">
              <label>Achievements / Certifications (one per line)</label>
              <textarea id="achievementsText" class="form-control" rows="4"></textarea>
            </div>
          </div>

          <div class="editor-section">
            <h3><i class="fa-solid fa-address-book"></i> Contact & Social</h3>
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="contactEmail" class="form-control">
            </div>
            <div class="form-group">
              <label>LinkedIn</label>
              <input type="url" id="socialLinkedin" class="form-control">
            </div>
            <div class="form-group">
              <label>GitHub / Twitter</label>
              <input type="url" id="socialOther" class="form-control">
            </div>
          </div>

        </div>

        <div class="portfolio-preview-container">
          <div class="preview-header">Live Preview</div>
          <iframe id="livePreviewFrame" src="portfolio-preview.html?mode=preview" class="preview-iframe"></iframe>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/services/api-service.js"></script>
  <script src="../js/pages/portfolio-builder.js"></script>
</body>
</html>
