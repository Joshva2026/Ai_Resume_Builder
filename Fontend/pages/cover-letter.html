<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tailored Cover Letters — ResumeForge</title>
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Styles -->
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/app-shell.css">
<link rel="stylesheet" href="../css/animations.css">
<style>
.cl-layout {
  display: grid;
  grid-template-columns: 1.2fr 1.8fr;
  gap: var(--sp-5);
  align-items: start;
}
@media (max-width: 1024px) {
  .cl-layout {
    grid-template-columns: 1fr;
  }
}
.cl-card {
  background: var(--paper-0);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--sp-5);
  box-shadow: var(--shadow-sm);
  margin-bottom: var(--sp-4);
}
.cl-editor {
  width: 100%;
  min-height: 440px;
  background: var(--paper-0);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: var(--sp-4);
  color: var(--ink-950);
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  line-height: 1.6;
  resize: vertical;
  outline: none;
}
.cl-editor:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--signal-100);
}
.letter-history-list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.letter-history-item {
  border: 1px solid var(--line);
  border-radius: var(--radius-xs);
  padding: var(--sp-3);
  background: var(--paper-50);
  font-size: var(--fs-xs);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: all var(--dur-fast) var(--ease-out);
}
.letter-history-item:hover {
  border-color: var(--primary);
  background: var(--signal-100);
}
.letter-history-item .title {
  font-weight: 700;
  color: var(--ink-950);
}
.letter-history-item .date {
  font-size: var(--fs-3xs);
  color: var(--ink-600);
}

.drop-zone {
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-sm);
  padding: var(--sp-5) var(--sp-4);
  text-align: center;
  background: var(--paper-50);
  cursor: pointer;
  transition: all var(--dur-fast) var(--ease-out);
}

.drop-zone:hover, .drop-zone.dragover {
  border-color: var(--primary);
  background: var(--signal-100);
}

.drop-icon {
  font-size: 24px;
  color: var(--primary);
  margin-bottom: var(--sp-2);
}

.drop-text {
  font-weight: 600;
  font-size: var(--fs-xs);
  color: var(--ink-900);
}

.browse-link {
  color: var(--primary);
  text-decoration: underline;
}

.drop-hint {
  font-size: var(--fs-3xs);
  color: var(--ink-600);
  margin-top: 4px;
}

.file-info-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--sp-3) var(--sp-4);
  background: var(--paper-50);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
}

.file-info-left {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}

.file-icon {
  font-size: 20px;
  color: var(--primary);
}

.file-name {
  font-weight: 700;
  font-size: var(--fs-xs);
  color: var(--ink-950);
  max-width: 170px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-size {
  font-size: var(--fs-3xs);
  color: var(--ink-600);
}

.file-remove-btn {
  background: none;
  border: none;
  color: var(--ink-600);
  cursor: pointer;
  font-size: 15px;
  transition: color 0.2s;
}

.file-remove-btn:hover {
  color: var(--score-low);
}
</style>
</head>
<body>

<div id="appShellRoot"></div>

<template id="clTemplate">
  <div class="cl-layout">
    <!-- Left panel: Generator Inputs and History -->
    <div>
      <div class="cl-card">
        <h3>Tailored Cover Letter</h3>
        <p class="sub" style="margin-bottom:var(--sp-4)">Generate and edit professional, print-ready cover letters customized to specific roles.</p>
        
        <div class="field">
          <label>Resume Context Source</label>
          <div style="display:flex; gap:16px; margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px;">
            <label style="display:flex; align-items:center; gap:6px; font-size:var(--fs-xs); cursor:pointer; font-weight:600; color:var(--ink-800)">
              <input type="radio" name="contextSource" value="saved" checked style="accent-color:var(--primary)"> Saved Resume
            </label>
            <label style="display:flex; align-items:center; gap:6px; font-size:var(--fs-xs); cursor:pointer; font-weight:600; color:var(--ink-800)">
              <input type="radio" name="contextSource" value="upload" style="accent-color:var(--primary)"> Upload File
            </label>
          </div>
        </div>

        <!-- Saved Resume select wrapper -->
        <div id="savedResumeWrapper" class="field">
          <label for="resumeSelect">Select Resume Context</label>
          <select id="resumeSelect" style="width:100%;">
            <option value="">Loading your resumes…</option>
          </select>
        </div>

        <!-- File upload wrapper (initially hidden) -->
        <div id="fileUploadWrapper" class="field" style="display:none; margin-bottom: var(--sp-4);">
          <label>Upload Resume File</label>
          <div class="drop-zone" id="dropZone">
            <i class="fa-solid fa-file-arrow-up drop-icon"></i>
            <p class="drop-text">Drag & drop resume here, or <span class="browse-link">browse</span></p>
            <p class="drop-hint">PDF, DOC, DOCX, TXT up to 10 MB</p>
            <input type="file" id="resumeFileInput" accept=".pdf,.doc,.docx,.txt,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" hidden>
          </div>
          <div id="fileInfo" class="file-info-box" style="display: none; margin-top: 8px;">
            <div class="file-info-left">
              <i class="fa-solid fa-file-lines file-icon"></i>
              <div>
                <div class="file-name" id="fileName">resume.pdf</div>
                <div class="file-size" id="fileSize">2.4 MB</div>
              </div>
            </div>
            <button type="button" class="file-remove-btn" id="removeFileBtn" title="Remove file"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>

        <div class="field">
          <label for="jobTitle">Job Title</label>
          <input type="text" id="jobTitle" placeholder="e.g. Senior Backend Architect">
        </div>

        <div class="field">
          <label for="companyName">Company Name</label>
          <input type="text" id="companyName" placeholder="e.g. Stripe">
        </div>

        <div class="field">
          <label for="jobDescription">Job Description Requirements (Optional)</label>
          <textarea id="jobDescription" rows="4" placeholder="Paste the vacancy description here to tailor specific matches..."></textarea>
        </div>

        <div id="clErrorBox" class="scan-error-box" style="display:none; color:var(--score-low); margin-bottom:var(--sp-3)"></div>

        <button class="btn btn-primary btn-block btn-lg" id="btnGenerate"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate Cover Letter</button>
      </div>

      <div class="cl-card">
        <h3>Saved Letters</h3>
        <div class="letter-history-list" id="letterHistory">
          <p style="color:var(--ink-600); font-size:var(--fs-xs)">No saved cover letters yet.</p>
        </div>
      </div>
    </div>

    <!-- Right panel: Document Editor -->
    <div class="cl-card">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding-bottom:var(--sp-3); margin-bottom:var(--sp-4)">
        <h3>Letter Document</h3>
        <div style="display:flex; gap:6px">
          <button class="btn btn-sm btn-ghost" id="btnCopy"><i class="fa-regular fa-copy"></i> Copy</button>
          <button class="btn btn-sm btn-ghost" id="btnPrint"><i class="fa-solid fa-print"></i> Print / PDF</button>
          <button class="btn btn-sm btn-primary" id="btnSave" style="display:none"><i class="fa-solid fa-save"></i> Save Changes</button>
        </div>
      </div>

      <textarea class="cl-editor" id="clContent" placeholder="Your tailored cover letter document will appear here..."></textarea>
    </div>
  </div>
</template>

<script src="../js/services/api-service.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/components/app-shell.js"></script>
<script>
AppShell.render({ active: 'cover-letter', title: 'Cover Letter Builder' });
const content = document.getElementById('appContent');
content.appendChild(document.getElementById('clTemplate').content.cloneNode(true));
</script>
<script src="../js/pages/cover-letter.js"></script>
<a href="../index.html" class="global-back-btn" aria-label="Back to Home" title="Back to Home"><i class="fa-solid fa-house"></i></a>
</body>
</html>
