<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tailored Cover Letters — ResumeForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/app-shell.css">
<style>
.cl-layout {
  display: grid;
  grid-template-columns: 1.2fr 1.8fr;
  gap: var(--sp-5);
  align-items: start;
}
@media (max-width: 1024px) {
  .cl-layout {
    grid-template-columns: 1fr;
  }
}
.cl-card {
  background: var(--paper-100);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--sp-5);
  box-shadow: var(--shadow-sm);
  margin-bottom: var(--sp-4);
}
.cl-editor {
  width: 100%;
  min-height: 400px;
  background: var(--paper-200);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: var(--sp-4);
  color: var(--ink-100);
  font-family: var(--font-sans);
  font-size: var(--fs-sm);
  line-height: 1.6;
  resize: vertical;
  outline: none;
}
.cl-editor:focus {
  border-color: var(--signal-500);
}
.letter-history-list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.letter-history-item {
  border: 1px solid var(--line);
  border-radius: var(--radius-xs);
  padding: var(--sp-3);
  background: rgba(255, 255, 255, 0.01);
  font-size: var(--fs-xs);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: all var(--dur-base) ease;
}
.letter-history-item:hover {
  border-color: var(--signal-500);
  background: rgba(255, 255, 255, 0.03);
}
.letter-history-item .title {
  font-weight: 600;
  color: var(--ink-200);
}
.letter-history-item .date {
  font-size: var(--fs-2xs);
  color: var(--ink-600);
}
</style>
</head>
<body>

<div id="appShellRoot"></div>

<template id="clTemplate">
  <div class="cl-layout">
    <!-- Left panel: Generator Inputs and History -->
    <div>
      <div class="cl-card">
        <h3>Tailored Cover Letter</h3>
        <p class="sub" style="margin-bottom:var(--sp-4)">Generate and edit professional, print-ready cover letters customized to specific roles.</p>
        
        <div class="field">
          <label>Select Resume Context</label>
          <select id="resumeSelect" style="width:100%; border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px; background:rgba(255,255,255,0.02); color:white"><option value="">Loading your resumes…</option></select>
        </div>

        <div class="field">
          <label>Job Title</label>
          <input type="text" id="jobTitle" placeholder="e.g. Senior Backend Architect">
        </div>

        <div class="field">
          <label>Company Name</label>
          <input type="text" id="companyName" placeholder="e.g. Stripe">
        </div>

        <div class="field">
          <label>Job Description Requirements (Optional)</label>
          <textarea id="jobDescription" rows="5" placeholder="Paste the vacancy description here to tailor specific matches..."></textarea>
        </div>

        <div id="clErrorBox" class="scan-error-box" style="display:none; color:var(--score-low); margin-bottom:var(--sp-3)"></div>

        <button class="btn btn-primary btn-block btn-lg" id="btnGenerate"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate Cover Letter</button>
      </div>

      <div class="cl-card">
        <h3>Saved Letters</h3>
        <div class="letter-history-list" id="letterHistory">
          <p style="color:var(--ink-600); font-size:var(--fs-xs)">No saved cover letters yet.</p>
        </div>
      </div>
    </div>

    <!-- Right panel: Document Editor -->
    <div class="cl-card">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding-bottom:var(--sp-3); margin-bottom:var(--sp-4)">
        <h3>Letter Document</h3>
        <div style="display:flex; gap:6px">
          <button class="btn btn-sm btn-ghost" id="btnCopy"><i class="fa-regular fa-copy"></i> Copy</button>
          <button class="btn btn-sm btn-ghost" id="btnPrint"><i class="fa-solid fa-print"></i> Print / PDF</button>
          <button class="btn btn-sm btn-accent" id="btnSave" style="display:none"><i class="fa-solid fa-save"></i> Save Changes</button>
        </div>
      </div>

      <textarea class="cl-editor" id="clContent" placeholder="Your tailored cover letter document will appear here..."></textarea>
    </div>
  </div>
</template>

<script src="../js/services/api-service.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/components/app-shell.js"></script>
<script>
AppShell.render({ active: 'cover-letter', title: 'Cover Letter Builder' });
const content = document.getElementById('appContent');
content.appendChild(document.getElementById('clTemplate').content.cloneNode(true));
</script>
<script src="../js/pages/cover-letter.js"></script>
<a href="../index.html" class="global-back-btn" aria-label="Back to Home" title="Back to Home"><i class="fa-solid fa-house"></i></a>
</body>
</html>
