<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Your Password — ResumeForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="auth-shell">
  <section class="auth-visual">
    <a href="../index.html" class="brand"><span class="brand-mark">RF</span>ResumeForge</a>
    <div class="auth-quote">
      <p class="big">"The version history alone saved me — I could compare drafts and see which changes moved my score."</p>
      <div class="person">
        <span class="avatar">AR</span>
        <div><strong>Aditya Rao</strong><span>Backend Engineer</span></div>
      </div>
    </div>
    <div style="font-size:var(--fs-2xs); color:var(--ink-400)">© 2026 ResumeForge</div>
  </section>

  <section class="auth-form-wrap">
    <div class="auth-form-inner">
      <a href="../index.html" class="brand" style="justify-content: center; margin-bottom: var(--sp-5);"><span class="brand-mark">RF</span>ResumeForge</a>
      <h1>Forgot Password? 🔒</h1>
      <p class="sub">We'll send you a reset link to your email.</p>
 
       <div class="form-error" id="formError"><i class="fa-solid fa-circle-exclamation"></i><span></span></div>
       <div class="form-success" id="formSuccess"><i class="fa-solid fa-circle-check"></i><span>Reset link sent — check your inbox.</span></div>
 
       <form id="forgotForm" novalidate>
         <div class="field">
           <label for="email">Email Address</label>
           <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
         </div>
         <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-bottom: var(--sp-4);" id="forgotSubmit">Send Reset Link</button>
       </form>

       <p class="auth-switch"><a href="login.html" class="btn-text">Back to Login</a></p>
    </div>
  </section>
</div>

<script src="../js/services/api-service.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('formError');
  const successBox = document.getElementById('formSuccess');
  const submitBtn = document.getElementById('forgotSubmit');
  errorBox.classList.remove('is-visible');
  successBox.classList.remove('is-visible');

  const email = document.getElementById('email').value.trim();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending…';

  try {
    await ApiService.auth.forgotPassword(email);
    successBox.classList.add('is-visible');
    document.getElementById('forgotForm').reset();
  } catch (err) {
    errorBox.querySelector('span').textContent = err.message || 'Could not send reset link.';
    errorBox.classList.add('is-visible');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send Reset Link';
  }
});
</script>
  <a href="../index.html" class="global-back-btn" aria-label="Back to Home" title="Back to Home"><i class="fa-solid fa-house"></i></a>
</body>
</html>
