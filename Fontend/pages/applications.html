<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Tracker — ResumeForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/app-shell.css">
<style>
.kanban-board {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: var(--sp-4);
  align-items: start;
  overflow-x: auto;
  padding-bottom: var(--sp-4);
}
@media (max-width: 1200px) {
  .kanban-board {
    grid-template-columns: repeat(3, 1fr);
  }
}
@media (max-width: 768px) {
  .kanban-board {
    grid-template-columns: 1fr;
  }
}
.kanban-column {
  background: var(--paper-100);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--sp-3);
  min-height: 400px;
  display: flex;
  flex-direction: column;
}
.kanban-column h4 {
  font-family: var(--font-display);
  font-size: var(--fs-xs);
  font-weight: 700;
  text-transform: uppercase;
  color: var(--ink-200);
  margin-bottom: var(--sp-3);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid var(--line);
  padding-bottom: 6px;
}
.kanban-column h4 span {
  font-size: var(--fs-2xs);
  background: var(--line);
  color: var(--ink-400);
  padding: 2px 6px;
  border-radius: 4px;
}
.kanban-cards {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  flex: 1;
}
.kanban-card {
  background: var(--paper-200);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: var(--sp-3);
  box-shadow: var(--shadow-sm);
  cursor: grab;
  transition: all var(--dur-base) ease;
}
.kanban-card:hover {
  border-color: var(--signal-500);
  transform: translateY(-1px);
}
.kanban-card .title {
  font-weight: 600;
  font-size: var(--fs-xs);
  color: var(--ink-100);
}
.kanban-card .company {
  font-size: var(--fs-2xs);
  color: var(--ink-500);
  margin-bottom: var(--sp-2);
}
.kanban-card .notes {
  font-size: var(--fs-3xs);
  color: var(--ink-600);
  margin-bottom: var(--sp-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.kanban-card .actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--fs-2xs);
}
.kanban-card select {
  font-size: var(--fs-3xs);
  background: var(--line);
  color: var(--ink-200);
  border: 1px solid var(--line);
  border-radius: var(--radius-xs);
  padding: 2px;
}

/* Modal styles */
.app-modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(4px);
}
.app-modal-content {
  background: var(--paper-100);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  width: 90%;
  max-width: 500px;
  padding: var(--sp-5);
  box-shadow: var(--shadow-lg);
  position: relative;
}
.app-modal-content h3 {
  margin-bottom: var(--sp-4);
  font-family: var(--font-display);
}
.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  background: none;
  border: none;
  color: var(--ink-600);
  cursor: pointer;
  font-size: var(--fs-md);
}
</style>
</head>
<body>

<div id="appShellRoot"></div>

<template id="appsTemplate">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--sp-5)">
    <h2>Application Tracker</h2>
    <button class="btn btn-primary" id="btnNewApp"><i class="fa-solid fa-plus"></i> Add Application</button>
  </div>

  <div class="kanban-board">
    <!-- Wishlist -->
    <div class="kanban-column" data-status="Wishlist">
      <h4>Wishlist <span id="count_Wishlist">0</span></h4>
      <div class="kanban-cards" id="cards_Wishlist"></div>
    </div>
    
    <!-- Applied -->
    <div class="kanban-column" data-status="Applied">
      <h4>Applied <span id="count_Applied">0</span></h4>
      <div class="kanban-cards" id="cards_Applied"></div>
    </div>

    <!-- Screening -->
    <div class="kanban-column" data-status="Screening">
      <h4>Screening <span id="count_Screening">0</span></h4>
      <div class="kanban-cards" id="cards_Screening"></div>
    </div>

    <!-- Interview -->
    <div class="kanban-column" data-status="Interview">
      <h4>Interview <span id="count_Interview">0</span></h4>
      <div class="kanban-cards" id="cards_Interview"></div>
    </div>

    <!-- Offer -->
    <div class="kanban-column" data-status="Offer">
      <h4>Offer <span id="count_Offer">0</span></h4>
      <div class="kanban-cards" id="cards_Offer"></div>
    </div>

    <!-- Rejected -->
    <div class="kanban-column" data-status="Rejected">
      <h4>Rejected / Other <span id="count_Rejected">0</span></h4>
      <div class="kanban-cards" id="cards_Rejected"></div>
    </div>
  </div>

  <!-- Modal for Creating/Editing Application -->
  <div class="app-modal" id="appModal">
    <div class="app-modal-content">
      <button class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></button>
      <h3 id="modalTitle">Add Job Application</h3>
      <form id="appForm">
        <input type="hidden" id="appId">
        
        <div class="field">
          <label>Company Name</label>
          <input type="text" id="f_company" required placeholder="e.g. Google">
        </div>
        
        <div class="field">
          <label>Job Title</label>
          <input type="text" id="f_title" required placeholder="e.g. Frontend developer">
        </div>

        <div class="field">
          <label>Job URL (optional)</label>
          <input type="url" id="f_url" placeholder="https://...">
        </div>

        <div class="field">
          <label>Status</label>
          <select id="f_status">
            <option>Wishlist</option>
            <option>Applied</option>
            <option>Screening</option>
            <option>Interview</option>
            <option>Offer</option>
            <option>Rejected</option>
          </select>
        </div>

        <div class="field">
          <label>Applied Date (optional)</label>
          <input type="date" id="f_applied_date">
        </div>

        <div class="field">
          <label>Notes / Feedback</label>
          <textarea id="f_notes" rows="4" placeholder="Salary target, interview questions, follow-up checklist..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:var(--sp-4)">Save Application</button>
      </form>
    </div>
  </div>
</template>

<script src="../js/services/api-service.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/components/app-shell.js"></script>
<script>
AppShell.render({ active: 'applications', title: 'Application Tracker' });
const content = document.getElementById('appContent');
content.appendChild(document.getElementById('appsTemplate').content.cloneNode(true));
</script>
<script src="../js/pages/applications.js"></script>
<a href="../index.html" class="global-back-btn" aria-label="Back to Home" title="Back to Home"><i class="fa-solid fa-house"></i></a>
</body>
</html>
