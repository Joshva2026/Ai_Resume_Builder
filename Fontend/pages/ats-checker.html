<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATS Checker — ResumeForge</title>
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Styles -->
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/app-shell.css">
<link rel="stylesheet" href="../css/ats.css">
<link rel="stylesheet" href="../css/animations.css">
<style>
/* Local ATS Page Option Picker Cards */
.ats-options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
}

.ats-option-card {
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--sp-3) var(--sp-4);
  background: var(--paper-0);
  cursor: pointer;
  transition: all var(--dur-fast) var(--ease-out);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: var(--ink-800);
  min-height: 140px;
}

.ats-option-card:hover {
  border-color: var(--line-strong);
  box-shadow: var(--shadow-sm);
}

.ats-option-card.active {
  border-color: var(--primary);
  background: var(--signal-100);
  box-shadow: var(--shadow-sm);
}

.ats-option-head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-2);
}

.ats-option-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  background: var(--paper-100);
  color: var(--ink-600);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.ats-option-card.active .ats-option-icon {
  background: var(--primary);
  color: #FFFFFF;
}

.ats-option-card h4 {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--ink-950);
  font-weight: 700;
}

.ats-option-card p {
  color: var(--ink-600);
  font-size: 11px;
  line-height: 1.4;
  margin-bottom: var(--sp-2);
}

.drop-zone {
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-sm);
  padding: var(--sp-5) var(--sp-4);
  text-align: center;
  background: var(--paper-50);
  cursor: pointer;
  transition: all var(--dur-fast) var(--ease-out);
}

.drop-zone:hover, .drop-zone.dragover {
  border-color: var(--primary);
  background: var(--signal-100);
}

.drop-icon {
  font-size: 24px;
  color: var(--primary);
  margin-bottom: var(--sp-2);
}

.drop-text {
  font-weight: 600;
  font-size: var(--fs-xs);
  color: var(--ink-900);
}

.browse-link {
  color: var(--primary);
  text-decoration: underline;
}

.drop-hint {
  font-size: var(--fs-3xs);
  color: var(--ink-600);
  margin-top: 4px;
}

.file-info-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--sp-3) var(--sp-4);
  background: var(--paper-50);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
}

.file-info-left {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}

.file-icon {
  font-size: 20px;
  color: var(--primary);
}

.file-name {
  font-weight: 700;
  font-size: var(--fs-xs);
  color: var(--ink-950);
  max-width: 170px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-size {
  font-size: var(--fs-3xs);
  color: var(--ink-600);
}

.file-remove-btn {
  background: none;
  border: none;
  color: var(--ink-600);
  cursor: pointer;
  font-size: 15px;
  transition: color 0.2s;
}
.file-remove-btn:hover {
  color: var(--score-low);
}

.opt-tag {
  font-weight: 500;
  color: var(--primary);
  font-size: var(--fs-3xs);
  text-transform: uppercase;
}

.scan-error-box {
  padding: 10px 12px;
  background: var(--score-low-bg);
  border: 1px solid rgba(220,38,38,0.15);
  color: var(--score-low);
  border-radius: var(--radius-sm);
  font-size: var(--fs-xs);
  margin-bottom: var(--sp-3);
  font-weight: 500;
}

.ats-actions-bar {
  display: flex;
  gap: var(--sp-3);
  margin-top: var(--sp-5);
  flex-wrap: wrap;
}

@media (max-width: 860px) {
  .ats-options-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div id="appShellRoot"></div>

<template id="atsTemplate">
  <div class="ats-layout">
    <aside class="ats-input-panel">
      <h3>ATS Resume Scan</h3>
      <p class="sub">Analyze your resume formatting and relevance compared directly to target job postings.</p>

      <!-- Dual Option Cards -->
      <div class="ats-options-grid">
        <div class="ats-option-card active" id="cardOptionUpload">
          <div>
            <div class="ats-option-head">
              <div class="ats-option-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
              <h4>Upload PDF File</h4>
            </div>
            <p>Upload a completed resume file from your device storage.</p>
          </div>
          <button type="button" class="btn btn-sm btn-ghost btn-block" id="btnSelectFileOption">Select File</button>
        </div>

        <div class="ats-option-card" id="cardOptionSaved">
          <div>
            <div class="ats-option-head">
              <div class="ats-option-icon"><i class="fa-solid fa-file-user"></i></div>
              <h4>Saved Builder</h4>
            </div>
            <p>Analyze a resume you've already created in the builder.</p>
          </div>
          <button type="button" class="btn btn-sm btn-ghost btn-block" id="btnSelectCreatedOption">Select Saved</button>
        </div>
      </div>

      <!-- File Upload Inputs Container -->
      <div id="fileUploadContainer" class="input-section">
        <div class="drop-zone" id="dropZone">
          <i class="fa-solid fa-file-arrow-up drop-icon"></i>
          <p class="drop-text">Drag & drop your resume here, or <span class="browse-link">browse files</span></p>
          <p class="drop-hint">PDF, DOC, DOCX, TXT up to 10 MB</p>
          <input type="file" id="resumeFileInput" accept=".pdf,.doc,.docx,.txt,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" hidden>
        </div>
        <div id="fileInfo" class="file-info-box" style="display: none;">
          <div class="file-info-left">
            <i class="fa-solid fa-file-lines file-icon"></i>
            <div>
              <div class="file-name" id="fileName">resume.pdf</div>
              <div class="file-size" id="fileSize">2.4 MB</div>
            </div>
          </div>
          <button type="button" class="file-remove-btn" id="removeFileBtn" title="Remove file"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>

      <!-- Saved Resume Select Container -->
      <div id="savedResumeContainer" class="input-section" style="display: none;">
        <div class="field">
          <label>Select Saved Resume</label>
          <select id="resumeSelect"><option value="">Loading your saved resumes…</option></select>
        </div>
      </div>

      <!-- Optional Job Description -->
      <div class="field" style="margin-top: var(--sp-4);">
        <label>Job Description <span class="opt-tag">(Optional)</span></label>
        <textarea id="jobDescription" rows="5" placeholder="Paste target description to check for specific keyword match metrics…"></textarea>
      </div>

      <div id="scanErrorBox" class="scan-error-box" style="display:none;"></div>

      <button class="btn btn-accent btn-block btn-lg" id="runScan"><i class="fa-solid fa-magnifying-glass-chart"></i> Check ATS Score</button>
    </aside>

    <div class="ats-results" id="atsResults">
      <div class="ats-empty">
        <i class="fa-solid fa-gauge-high"></i>
        <h3>No analysis completed</h3>
        <p>Trigger a check by selecting a resume and clicking Check ATS Score above.</p>
      </div>
    </div>
  </div>
</template>

<script src="../js/services/api-service.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/components/app-shell.js"></script>
<script>
AppShell.render({ active: 'ats-checker', title: 'ATS Checker' });
const content = document.getElementById('appContent');
content.appendChild(document.getElementById('atsTemplate').content.cloneNode(true));
</script>
<script src="../js/pages/ats-checker.js"></script>
<a href="../index.html" class="global-back-btn" aria-label="Back to Home" title="Back to Home"><i class="fa-solid fa-house"></i></a>
</body>
</html>
