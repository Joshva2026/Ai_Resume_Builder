<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — ResumeForge</title>
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Styles -->
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/app-shell.css">
<link rel="stylesheet" href="../css/animations.css">
<style>
/* Dashboard layout specifics */
.dashboard-greeting {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: var(--sp-5) var(--sp-6);
  box-shadow: var(--glass-shadow);
  margin-bottom: var(--sp-5);
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
}
@media (max-width: 640px) {
  .dashboard-greeting {
    flex-direction: column;
    align-items: flex-start;
    gap: var(--sp-3);
  }
  .dashboard-greeting .btn {
    width: 100%;
  }
}
.dashboard-greeting h2 {
  font-size: var(--fs-lg);
  font-weight: 800;
  color: #FFFFFF;
  margin-bottom: var(--sp-1);
}
.dashboard-greeting p {
  color: var(--ink-600);
  font-size: var(--fs-sm);
}

.health-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--sp-4);
  margin-bottom: var(--sp-6);
}
@media (max-width: 1024px) {
  .health-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (max-width: 640px) {
  .health-grid {
    grid-template-columns: 1fr;
  }
}
.health-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: var(--sp-4);
  box-shadow: var(--glass-shadow);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  transition: all var(--dur-base) var(--ease-out);
}
.health-card:hover {
  transform: translateY(-2px);
  border-color: rgba(168, 85, 247, 0.3);
  box-shadow: var(--shadow-glow);
}
.health-card h4 {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-600);
  margin-bottom: var(--sp-3);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.health-card h4 i {
  color: var(--primary);
}
.health-card .score-row {
  display: flex;
  align-items: baseline;
  gap: 4px;
  margin-bottom: var(--sp-2);
}
.health-card .score-val {
  font-size: var(--fs-xl);
  font-weight: 800;
  color: #FFFFFF;
}
.health-card .score-pct {
  font-size: var(--fs-2xs);
  color: var(--score-high);
  font-weight: 600;
}
.health-card .score-pct.neutral {
  color: var(--ink-600);
}
.health-card .progress-track {
  width: 100%;
  height: 4px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: var(--radius-pill);
  overflow: hidden;
  margin-bottom: var(--sp-2);
}
.health-card .progress-fill {
  height: 100%;
  border-radius: var(--radius-pill);
  transition: width var(--dur-slow) var(--ease-out);
}

/* Two column layout panels */
.dash-panels {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: var(--sp-5);
  margin-bottom: var(--sp-6);
}
@media (max-width: 1024px) {
  .dash-panels {
    grid-template-columns: 1fr;
  }
}

.panel {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: var(--sp-5);
  box-shadow: var(--glass-shadow);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  display: flex;
  flex-direction: column;
}

.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--sp-4);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  padding-bottom: 12px;
}
.panel-head h3 {
  font-size: var(--fs-md);
  font-weight: 700;
  color: #FFFFFF;
}

/* Recent Resumes list styles */
.resume-list-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.resume-list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px;
  border-radius: var(--radius-md);
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.04);
  transition: all 0.2s ease;
}
.resume-list-item:hover {
  background: rgba(168, 85, 247, 0.04);
  border-color: rgba(168, 85, 247, 0.15);
}
.resume-item-info {
  display: flex;
  align-items: center;
  gap: 14px;
}
.resume-item-icon {
  font-size: 18px;
  color: var(--primary);
  background: rgba(168, 85, 247, 0.1);
  width: 36px;
  height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.resume-item-details h4 {
  font-size: var(--fs-xs);
  font-weight: 600;
  color: #FFFFFF;
  margin-bottom: 2px;
}
.resume-item-details p {
  font-size: 11px;
  color: var(--ink-600);
}
.resume-item-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.score-badge {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 13px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.score-badge.high {
  background: rgba(16, 185, 129, 0.12);
  color: var(--score-high);
  border: 1px solid rgba(16, 185, 129, 0.25);
  box-shadow: 0 0 10px rgba(16, 185, 129, 0.1);
}
.score-badge.mid {
  background: rgba(245, 158, 11, 0.12);
  color: var(--score-mid);
  border: 1px solid rgba(245, 158, 11, 0.25);
}
.score-badge.low {
  background: rgba(239, 68, 68, 0.12);
  color: var(--score-low);
  border: 1px solid rgba(239, 68, 68, 0.25);
}

.action-dropdown {
  position: relative;
  display: inline-block;
}
.dropdown-content {
  display: none;
  position: absolute;
  bottom: 100%;
  right: 0;
  background: #0d0c16;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: var(--glass-shadow);
  border-radius: var(--radius-md);
  z-index: 10;
  min-width: 160px;
  padding: 6px 0;
}
.dropdown-content button {
  color: var(--ink-700);
  padding: 8px 14px;
  text-decoration: none;
  display: block;
  font-size: var(--fs-xs);
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s ease;
}
.dropdown-content button:hover {
  background: rgba(255, 255, 255, 0.05);
  color: #FFFFFF;
}
.dropdown-content i {
  margin-right: 8px;
  width: 14px;
}
.action-dropdown:hover .dropdown-content {
  display: block;
}

/* AI Suggestions list styles */
.suggestions-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.suggestion-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.04);
  border-radius: var(--radius-md);
}
.suggestion-item i {
  color: var(--primary);
  font-size: 14px;
  margin-top: 2px;
  background: rgba(168, 85, 247, 0.1);
  padding: 6px;
  border-radius: 6px;
}
.suggestion-item-text h4 {
  font-size: var(--fs-xs);
  font-weight: 700;
  color: #FFFFFF;
  margin-bottom: 2px;
}
.suggestion-item-text p {
  font-size: 11px;
  color: var(--ink-600);
  line-height: 1.3;
}
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--ink-700);
}
</style>
</head>
<body>

<div id="appShellRoot"></div>

<template id="dashboardTemplate">
  <div class="dashboard-greeting">
    <div>
      <h2 id="greetingName">Good morning, John! ☕</h2>
      <p>Let's build something amazing today.</p>
    </div>
    <a href="resume-builder.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> New Resume</a>
  </div>

  <div class="health-grid">
    <div class="health-card">
      <h4>Total Resumes <i class="fa-solid fa-file-invoice"></i></h4>
      <div class="score-row">
        <span class="score-val" id="healthStrengthVal">0</span>
        <span class="score-pct" id="healthStrengthGrowth">+2 this month</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="healthStrengthBar" style="width: 0%; background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);"></div></div>
      <span class="score-pct neutral" id="healthStrengthLabel">0 active resumes</span>
    </div>
    
    <div class="health-card">
      <h4>ATS Score (Avg) <i class="fa-solid fa-gauge-high"></i></h4>
      <div class="score-row">
        <span class="score-val" id="healthAtsVal">0%</span>
        <span class="score-pct" id="healthAtsGrowth">+12% this week</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="healthAtsBar" style="width: 0%; background: var(--score-high);"></div></div>
      <span class="score-pct neutral" id="healthAtsLabel">Based on scans</span>
    </div>

    <div class="health-card">
      <h4>Applications <i class="fa-solid fa-briefcase"></i></h4>
      <div class="score-row">
        <span class="score-val" id="healthLinkedinVal">0</span>
        <span class="score-pct" id="healthLinkedinGrowth">+5 this week</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="healthLinkedinBar" style="width: 0%; background: var(--accent);"></div></div>
      <span class="score-pct neutral" id="healthLinkedinLabel">Tracked jobs</span>
    </div>

    <div class="health-card">
      <h4>Saved Templates <i class="fa-solid fa-cubes"></i></h4>
      <div class="score-row">
        <span class="score-val" id="healthMatchVal">0</span>
        <span class="score-pct neutral" id="healthMatchGrowth">templates</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="healthMatchBar" style="width: 0%; background: var(--score-high);"></div></div>
      <span class="score-pct neutral" id="healthMatchLabel">Active templates</span>
    </div>
  </div>

  <div class="dash-panels">
    <div class="panel">
      <div class="panel-head">
        <h3>Recent Resumes</h3>
      </div>
      <div class="resume-list-container" id="resumeGrid">
        <div class="resume-list-item" style="border-style: dashed; background: transparent; cursor: pointer; justify-content: center; opacity: 0.75;" onclick="window.location.href='resume-builder.html'">
          <div style="display:flex; align-items:center; gap:8px;">
            <i class="fa-solid fa-circle-plus" style="color: var(--primary);"></i>
            <span style="font-size: var(--fs-xs); font-weight:600; color:#FFFFFF;">Create New Resume</span>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>AI Suggestions</h3>
      </div>
      <div class="suggestions-list" id="suggestionsGrid">
        <div class="suggestion-item">
          <i class="fa-solid fa-chart-line"></i>
          <div class="suggestion-item-text">
            <h4>Add more quantifiable achievements</h4>
            <p>Increase your impact by adding metrics and numbers to your experience bullets.</p>
          </div>
        </div>
        <div class="suggestion-item">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <div class="suggestion-item-text">
            <h4>Improve your skills section</h4>
            <p>Add in-demand keywords tailored to your target software developer roles.</p>
          </div>
        </div>
        <div class="suggestion-item">
          <i class="fa-solid fa-circle-check"></i>
          <div class="suggestion-item-text">
            <h4>Optimize your summary</h4>
            <p>Make your summary more impactful to grab recruiter attention immediately.</p>
          </div>
        </div>
      </div>
      <a href="ai-assistant.html" class="btn btn-ghost btn-sm" style="margin-top: var(--sp-4); text-align: center; justify-content: center; width: 100%;">See All Suggestions</a>
    </div>
  </div>
</template>

<script src="../js/services/api-service.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/components/app-shell.js"></script>
<script>
AppShell.render({ active: 'dashboard', title: 'Dashboard' });

const content = document.getElementById('appContent');
content.appendChild(document.getElementById('dashboardTemplate').content.cloneNode(true));

async function loadDashboard() {
  const resumeGrid = document.getElementById('resumeGrid');

  // Load User Details for Greeting
  try {
    const { user } = await ApiService.auth.me();
    const firstName = user?.firstName || user?.email.split('@')[0] || 'User';
    document.getElementById('greetingName').textContent = `Good morning, ${firstName}! ☕`;
  } catch (err) {
    console.warn('Greeting fetch error', err);
  }

  let resumes = [];
  let atsHistory = [];
  let apps = [];

  try {
    resumes = await ApiService.resumes.list();
  } catch (err) {
    console.warn('Error loading resumes list', err);
  }

  try {
    atsHistory = await ApiService.ats.history();
  } catch (err) {
    console.warn('Error loading ATS history', err);
  }

  try {
    apps = await ApiService.applications.list();
  } catch (err) {
    console.warn('Error loading applications list', err);
  }

  // Card 1: Resumes Created
  document.getElementById('healthStrengthVal').textContent = resumes.length;
  document.getElementById('healthStrengthBar').style.width = resumes.length > 0 ? '100%' : '0%';
  document.getElementById('healthStrengthLabel').textContent = `${resumes.length} active resume${resumes.length === 1 ? '' : 's'}`;
  document.getElementById('healthStrengthGrowth').textContent = resumes.length > 0 ? `+${resumes.length} this month` : '0 this month';

  // Card 2: ATS Score
  const avgAts = atsHistory.length
    ? Math.round(atsHistory.reduce((sum, r) => sum + (r.overall_score || 0), 0) / atsHistory.length)
    : 0;
  document.getElementById('healthAtsVal').textContent = avgAts ? `${avgAts}%` : '–';
  document.getElementById('healthAtsBar').style.width = `${avgAts}%`;
  document.getElementById('healthAtsLabel').textContent = atsHistory.length ? `Based on ${atsHistory.length} scans` : 'No scans performed';
  document.getElementById('healthAtsGrowth').textContent = avgAts > 0 ? `+${Math.round(avgAts * 0.1)}% this week` : '0% this week';

  // Card 3: Applications Tracker
  document.getElementById('healthLinkedinVal').textContent = apps.length;
  document.getElementById('healthLinkedinBar').style.width = apps.length > 0 ? '100%' : '0%';
  document.getElementById('healthLinkedinLabel').textContent = `${apps.length} tracked application${apps.length === 1 ? '' : 's'}`;
  document.getElementById('healthLinkedinGrowth').textContent = apps.length > 0 ? `+${apps.length} this week` : '0 this week';

  // Card 4: Profile Completion / Saved Templates
  const templateCount = new Set(resumes.map(r => r.template_id).filter(Boolean)).size || 1;
  document.getElementById('healthMatchVal').textContent = templateCount;
  document.getElementById('healthMatchBar').style.width = `${Math.min(templateCount * 25, 100)}%`;
  document.getElementById('healthMatchLabel').textContent = `${resumes.length} total resume versions`;
  document.getElementById('healthMatchGrowth').textContent = `${templateCount} template${templateCount === 1 ? '' : 's'}`;

  // Render Resumes Grid
  try {
    let cardsHtml = resumes.map((r) => {
      const completeness = calculateCompleteness(r.content);
      
      // Find latest ATS score for this resume
      const resumeScans = atsHistory.filter(s => s.resume_id === r.id);
      const atsScore = resumeScans.length > 0 ? resumeScans[0].overall_score : null;
      
      let scoreBadgeHtml = '';
      if (atsScore) {
        const scoreClass = atsScore >= 80 ? 'high' : atsScore >= 60 ? 'mid' : 'low';
        scoreBadgeHtml = `<div class="score-badge ${scoreClass}" style="margin-right: 8px;">${atsScore}</div>`;
      } else {
        const completenessClass = completeness >= 80 ? 'high' : completeness >= 50 ? 'mid' : 'low';
        scoreBadgeHtml = `<div class="score-badge ${completenessClass}" style="margin-right: 8px;" title="Details Completeness">${completeness}</div>`;
      }

      return `
        <div class="resume-list-item" id="resumeCard_${r.id}">
          <div class="resume-item-info">
            <div class="resume-item-icon"><i class="fa-regular fa-file-lines"></i></div>
            <div class="resume-item-details">
              <h4>${escapeHtml(r.title || 'Untitled Resume')}</h4>
              <p>Updated ${new Date(r.updated_at || r.created_at || Date.now()).toLocaleDateString()}</p>
            </div>
          </div>
          
          <div class="resume-item-actions">
            ${scoreBadgeHtml}
            <a href="resume-builder.html?id=${r.id}" class="btn btn-ghost btn-sm"><i class="fa-solid fa-pen"></i> Edit</a>
            
            <div class="action-dropdown">
              <button class="btn btn-ghost btn-sm"><i class="fa-solid fa-ellipsis"></i> Actions</button>
              <div class="dropdown-content">
                <button onclick="duplicateResume(${r.id})"><i class="fa-solid fa-copy"></i> Duplicate</button>
                <button onclick="downloadPdf(${r.id})"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
                <button onclick="viewVersions(${r.id})"><i class="fa-solid fa-clock-rotate-left"></i> Versions</button>
                <button onclick="deleteResume(${r.id})" style="color:var(--score-low)"><i class="fa-solid fa-trash"></i> Delete</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    // Append the standard "Create Resume" card at the end
    cardsHtml += `
      <div class="resume-list-item" style="border-style: dashed; background: transparent; cursor: pointer; justify-content: center; opacity: 0.75;" onclick="window.location.href='resume-builder.html'">
        <div style="display:flex; align-items:center; gap:8px;">
          <i class="fa-solid fa-circle-plus" style="color: var(--primary);"></i>
          <span style="font-size: var(--fs-xs); font-weight:600; color:#FFFFFF;">Create New Resume</span>
        </div>
      </div>
    `;

    resumeGrid.innerHTML = cardsHtml;

  } catch (err) {
    console.error('Error rendering resumes grid', err);
    resumeGrid.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <h4>Error loading dashboard</h4>
        <p>${escapeHtml(err.message)}</p>
        <a href="resume-builder.html" class="btn btn-primary">Build My Resume</a>
      </div>`;
  }
}

// Duplicates resume
async function duplicateResume(id) {
  try {
    await ApiService.resumes.duplicate(id);
    if (typeof window.showToast === 'function') window.showToast('Resume duplicated successfully!', 'success');
    loadDashboard();
  } catch (err) {
    if (typeof window.showToast === 'function') window.showToast('Failed to duplicate resume: ' + err.message, 'error');
  }
}

// Download PDF trigger
async function downloadPdf(id) {
  try {
    if (typeof window.showToast === 'function') window.showToast('Generating PDF — this may take a moment...', 'info');
    await ApiService.downloads.pdf(id);
    if (typeof window.showToast === 'function') window.showToast('PDF downloaded successfully!', 'success');
  } catch (err) {
    if (typeof window.showToast === 'function') window.showToast('Failed to generate PDF: ' + err.message, 'error');
  }
}

// View Versions trigger
async function viewVersions(id) {
  try {
    const versions = await ApiService.resumes.getVersions(id);
    if (!versions || versions.length === 0) {
      if (typeof window.showToast === 'function') window.showToast('No saved versions found for this resume. Version checkpoints are created automatically upon restoring.', 'info');
      return;
    }
    
    const latestVersion = versions[0];
    if (typeof window.confirmModal === 'function') {
      const ok = await window.confirmModal({
        title: `Restore Version ${latestVersion.version_number}?`,
        message: `Would you like to restore Version ${latestVersion.version_number} (saved on ${new Date(latestVersion.created_at).toLocaleString()})? Your current resume state will be archived as a new version checkpoint.`,
        confirmText: 'Restore Version',
        cancelText: 'Cancel'
      });
      
      if (ok) {
        const restoreRes = await ApiService.resumes.restoreVersion(id, latestVersion.id);
        if (typeof window.showToast === 'function') window.showToast(restoreRes.message || 'Version restored successfully!', 'success');
        setTimeout(() => window.location.reload(), 600);
      }
    }
  } catch (err) {
    if (typeof window.showToast === 'function') window.showToast('Failed to fetch versions: ' + err.message, 'error');
  }
}

// Delete resume
async function deleteResume(id) {
  if (typeof window.confirmModal === 'function') {
    const ok = await window.confirmModal({
      title: 'Delete Resume?',
      message: 'Are you sure you want to delete this resume? This action is irreversible.',
      confirmText: 'Delete',
      cancelText: 'Cancel',
      isDanger: true
    });
    if (!ok) return;
  }
  try {
    await ApiService.resumes.remove(id);
    if (typeof window.showToast === 'function') window.showToast('Resume deleted successfully.', 'success');
    loadDashboard();
  } catch (err) {
    if (typeof window.showToast === 'function') window.showToast('Delete failed: ' + err.message, 'error');
  }
}

// Completeness score calculator
function calculateCompleteness(content) {
  if (!content) return 0;
  let score = 0;
  
  // Personal Info details: name, headline, email, phone, location
  const p = content.personal || {};
  if (p.fullName) score += 20;
  if (p.headline) score += 10;
  if (p.email) score += 10;
  if (p.phone) score += 5;
  if (p.location) score += 5;
  
  // Sections completed
  if (content.summary && content.summary.trim().length > 10) score += 15;
  if (content.experience && content.experience.length > 0) score += 15;
  if (content.education && content.education.length > 0) score += 10;
  if (content.skills && content.skills.trim().length > 5) score += 10;
  
  return Math.min(score, 100);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

loadDashboard();
</script>
