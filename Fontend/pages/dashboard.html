<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — ResumeForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/app-shell.css">
<style>
.dashboard-greeting {
  margin-bottom: var(--sp-5);
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: var(--sp-5);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--glass-shadow);
}
.dashboard-greeting h2 {
  font-family: var(--font-display);
  font-size: var(--fs-xl);
  font-weight: 700;
  color: var(--ink-100);
  margin-bottom: var(--sp-1);
}
.dashboard-greeting p {
  color: var(--ink-600);
  font-size: var(--fs-base);
}

.health-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--sp-4);
  margin-bottom: var(--sp-6);
}
.health-card {
  background: var(--paper-100);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--sp-4);
  box-shadow: var(--shadow-sm);
  transition: all var(--dur-base) var(--ease-out);
}
.health-card:hover {
  transform: translateY(-2px);
  border-color: var(--signal-400);
  box-shadow: var(--shadow-md);
}
.health-card h4 {
  font-size: var(--fs-2xs);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-600);
  margin-bottom: var(--sp-3);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.health-card h4 i {
  color: var(--signal-500);
}
.health-card .score-row {
  display: flex;
  align-items: baseline;
  gap: var(--sp-1);
  margin-bottom: var(--sp-2);
}
.health-card .score-val {
  font-size: var(--fs-xl);
  font-weight: 700;
  color: var(--ink-100);
}
.health-card .score-pct {
  font-size: var(--fs-xs);
  color: var(--ink-600);
}
.health-card .progress-track {
  width: 100%;
  height: 6px;
  background: var(--line);
  border-radius: var(--radius-pill);
  overflow: hidden;
  margin-bottom: var(--sp-2);
}
.health-card .progress-fill {
  height: 100%;
  border-radius: var(--radius-pill);
  transition: width var(--dur-slow) var(--ease-out);
}

.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--sp-4);
}
.panel-head h3 {
  font-family: var(--font-display);
  font-size: var(--fs-lg);
  font-weight: 600;
  color: var(--ink-100);
}

.resume-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--sp-4);
  margin-bottom: var(--sp-6);
}
.resume-card {
  background: var(--paper-100);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 200px;
  position: relative;
  box-shadow: var(--shadow-sm);
  transition: all var(--dur-base) var(--ease-out);
}
.resume-card:hover {
  transform: translateY(-2px);
  border-color: var(--signal-500);
  box-shadow: var(--shadow-md);
}
.resume-card .card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: var(--sp-1);
}
.resume-card .card-title {
  font-family: var(--font-display);
  font-size: var(--fs-md);
  font-weight: 600;
  color: var(--ink-100);
}
.resume-card .card-meta {
  font-size: var(--fs-2xs);
  color: var(--ink-600);
  margin-bottom: var(--sp-3);
}
.resume-card .card-badges {
  display: flex;
  gap: var(--sp-2);
  margin-bottom: var(--sp-4);
  flex-wrap: wrap;
}
.resume-card .badge {
  font-size: var(--fs-2xs);
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  font-weight: 600;
}
.resume-card .badge-ats {
  background: var(--score-high-bg);
  color: var(--score-high);
}
.resume-card .badge-template {
  background: var(--line);
  color: var(--ink-200);
}
.resume-card .badge-completeness {
  background: var(--signal-100);
  color: var(--signal-500);
}
.resume-card .card-actions {
  display: flex;
  gap: var(--sp-2);
  margin-top: auto;
  align-items: center;
}
.resume-card .action-dropdown {
  position: relative;
  display: inline-block;
}
.resume-card .dropdown-content {
  display: none;
  position: absolute;
  bottom: 100%;
  left: 0;
  background: var(--paper-100);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
  border-radius: var(--radius-sm);
  z-index: 10;
  min-width: 160px;
  padding: 4px 0;
}
.resume-card .dropdown-content a, .resume-card .dropdown-content button {
  color: var(--ink-200);
  padding: 8px 12px;
  text-decoration: none;
  display: block;
  font-size: var(--fs-xs);
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
}
.resume-card .dropdown-content a:hover, .resume-card .dropdown-content button:hover {
  background: var(--line);
  color: var(--ink-100);
}
.resume-card .dropdown-content i {
  margin-right: 8px;
  width: 14px;
}
.resume-card .action-dropdown:hover .dropdown-content {
  display: block;
}

.create-resume-card {
  border: 2px dashed var(--line);
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  min-height: 200px;
}
.create-resume-card:hover {
  border-color: var(--signal-500);
  background: var(--glass-bg);
}
.create-resume-card i {
  font-size: var(--fs-xl);
  color: var(--ink-600);
  margin-bottom: var(--sp-2);
}
.create-resume-card h4 {
  font-size: var(--fs-md);
  font-weight: 600;
  color: var(--ink-200);
}
</style>
</head>
<body>

<div id="appShellRoot"></div>

<template id="dashboardTemplate">
  <div class="dashboard-greeting">
    <h2 id="greetingName">Good morning, Candidate</h2>
    <p>Build a stronger resume and land your next opportunity.</p>
  </div>

  <div class="health-grid">
    <div class="health-card">
      <h4>Resume Strength <i class="fa-solid fa-file-invoice"></i></h4>
      <div class="score-row">
        <span class="score-val" id="healthStrengthVal">0</span>
        <span class="score-pct">%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="healthStrengthBar" style="width: 0%; background: var(--signal-500);"></div></div>
      <span class="score-pct" id="healthStrengthLabel">Complete sections</span>
    </div>
    
    <div class="health-card">
      <h4>ATS Readiness <i class="fa-solid fa-gauge-high"></i></h4>
      <div class="score-row">
        <span class="score-val" id="healthAtsVal">0</span>
        <span class="score-pct">/100</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="healthAtsBar" style="width: 0%; background: var(--score-high);"></div></div>
      <span class="score-pct" id="healthAtsLabel">Est. ATS rating</span>
    </div>

    <div class="health-card">
      <h4>LinkedIn Score <i class="fa-brands fa-linkedin"></i></h4>
      <div class="score-row">
        <span class="score-val" id="healthLinkedinVal">0</span>
        <span class="score-pct">%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="healthLinkedinBar" style="width: 0%; background: var(--signal-600);"></div></div>
      <span class="score-pct" id="healthLinkedinLabel">Profile audit strength</span>
    </div>

    <div class="health-card">
      <h4>Job Match Score <i class="fa-solid fa-compress"></i></h4>
      <div class="score-row">
        <span class="score-val" id="healthMatchVal">0</span>
        <span class="score-pct">%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="healthMatchBar" style="width: 0%; background: var(--signal-600);"></div></div>
      <span class="score-pct" id="healthMatchLabel">Average job match score</span>
    </div>
  </div>

  <div class="dash-panels">
    <div class="panel">
      <div class="panel-head">
        <h3>My Resumes</h3>
        <a href="resume-builder" class="btn btn-primary"><i class="fa-solid fa-plus"></i> New Resume</a>
      </div>
      
      <div class="resume-grid" id="resumeGrid">
        <div class="resume-card create-resume-card" onclick="window.location.href='resume-builder'">
          <i class="fa-solid fa-circle-plus"></i>
          <h4>Create New Resume</h4>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="../js/services/api-service.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/components/app-shell.js"></script>
<script>
AppShell.render({ active: 'dashboard', title: 'Dashboard' });

const content = document.getElementById('appContent');
content.appendChild(document.getElementById('dashboardTemplate').content.cloneNode(true));

async function loadDashboard() {
  const resumeGrid = document.getElementById('resumeGrid');

  // Load User Details for Greeting
  try {
    const { user } = await ApiService.auth.me();
    const firstName = user?.firstName || user?.email.split('@')[0] || 'User';
    document.getElementById('greetingName').textContent = `Good morning, ${firstName}`;
  } catch (err) {
    console.warn('Greeting fetch error', err);
  }

  // Load Health Stats: LinkedIn Review & Job Match History
  let linkedinScore = 0;
  let matchScore = 0;
  
  try {
    const liHistory = await ApiService.linkedin.history();
    if (liHistory.length > 0) {
      linkedinScore = liHistory[0].score || 0;
    }
  } catch (err) {
    console.warn('LI score history error', err);
  }

  try {
    const jmHistory = await ApiService.jobMatch.history();
    const scoredMatches = jmHistory.filter(j => j.match_percentage > 0);
    if (scoredMatches.length > 0) {
      matchScore = Math.round(scoredMatches.reduce((sum, j) => sum + j.match_percentage, 0) / scoredMatches.length);
    }
  } catch (err) {
    console.warn('Job match history error', err);
  }

  // Render LinkedIn & Job Match Health Gauges
  document.getElementById('healthLinkedinVal').textContent = linkedinScore || '–';
  document.getElementById('healthLinkedinBar').style.width = `${linkedinScore}%`;
  document.getElementById('healthLinkedinLabel').textContent = linkedinScore ? 'Audit strength' : 'No audits completed';

  document.getElementById('healthMatchVal').textContent = matchScore || '–';
  document.getElementById('healthMatchBar').style.width = `${matchScore}%`;
  document.getElementById('healthMatchLabel').textContent = matchScore ? 'Avg match rate' : 'No matches evaluated';

  try {
    const resumes = await ApiService.resumes.list();
    const atsHistory = await ApiService.ats.history();

    // Render ATS Health Gauge
    const avgAts = atsHistory.length
      ? Math.round(atsHistory.reduce((sum, r) => sum + (r.overall_score || 0), 0) / atsHistory.length)
      : 0;
    document.getElementById('healthAtsVal').textContent = avgAts || '–';
    document.getElementById('healthAtsBar').style.width = `${avgAts}%`;
    document.getElementById('healthAtsLabel').textContent = atsHistory.length ? `${atsHistory.length} scans parsed` : 'No scans performed';

    // Calculate Completion Strength (Average completeness of all resumes)
    let totalCompleteness = 0;
    resumes.forEach(r => {
      totalCompleteness += calculateCompleteness(r.content);
    });
    const avgCompleteness = resumes.length ? Math.round(totalCompleteness / resumes.length) : 0;
    document.getElementById('healthStrengthVal').textContent = avgCompleteness;
    document.getElementById('healthStrengthBar').style.width = `${avgCompleteness}%`;

    // Render Resumes Grid
    let cardsHtml = resumes.map((r) => {
      const completeness = calculateCompleteness(r.content);
      
      // Find latest ATS score for this resume
      const resumeScans = atsHistory.filter(s => s.resume_id === r.id);
      const atsScore = resumeScans.length > 0 ? resumeScans[0].overall_score : null;
      const atsBadge = atsScore ? `<span class="badge badge-ats">ATS: ${atsScore}</span>` : '';
      const templateName = r.template_id ? `Template ${r.template_id}` : 'Standard';

      return `
        <div class="resume-card" id="resumeCard_${r.id}">
          <div class="card-header">
            <div class="card-title">${escapeHtml(r.title || 'Untitled Resume')}</div>
          </div>
          <div class="card-meta">Updated ${new Date(r.updated_at || r.created_at || Date.now()).toLocaleDateString()}</div>
          
          <div class="card-badges">
            ${atsBadge}
            <span class="badge badge-completeness">${completeness}% Complete</span>
            <span class="badge badge-template">${templateName}</span>
          </div>
          
          <div class="card-actions">
            <a href="resume-builder?id=${r.id}" class="btn btn-ghost" style="padding:6px 12px; font-size:12px"><i class="fa-solid fa-pen"></i> Edit</a>
            
            <div class="action-dropdown">
              <button class="btn btn-ghost" style="padding:6px 12px; font-size:12px"><i class="fa-solid fa-ellipsis"></i> Actions</button>
              <div class="dropdown-content">
                <button onclick="duplicateResume(${r.id})"><i class="fa-solid fa-copy"></i> Duplicate</button>
                <button onclick="downloadPdf(${r.id})"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
                <button onclick="viewVersions(${r.id})"><i class="fa-solid fa-clock-rotate-left"></i> Versions</button>
                <button onclick="deleteResume(${r.id})" style="color:var(--score-low)"><i class="fa-solid fa-trash"></i> Delete</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    // Append the standard "Create Resume" card at the end
    cardsHtml += `
      <div class="resume-card create-resume-card" onclick="window.location.href='resume-builder'">
        <i class="fa-solid fa-circle-plus"></i>
        <h4>Create New Resume</h4>
      </div>
    `;

    resumeGrid.innerHTML = cardsHtml;

  } catch (err) {
    console.error('Error loading dashboard resumes', err);
    resumeGrid.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <h4>Error loading dashboard</h4>
        <p>${escapeHtml(err.message)}</p>
        <a href="resume-builder" class="btn btn-primary">Build My Resume</a>
      </div>`;
  }
}

// Duplicates resume
async function duplicateResume(id) {
  try {
    await ApiService.resumes.duplicate(id);
    loadDashboard();
  } catch (err) {
    alert('Failed to duplicate resume: ' + err.message);
  }
}

// Download PDF trigger
async function downloadPdf(id) {
  try {
    const res = await ApiService.downloads.pdf(id);
    const url = res.downloadUrl || res.url;
    if (url) {
      window.open(url, '_blank');
    } else {
      alert('PDF is being generated. Please wait.');
    }
  } catch (err) {
    alert('Failed to generate PDF: ' + err.message);
  }
}

// View Versions trigger
async function viewVersions(id) {
  try {
    const versions = await ApiService.resumes.getVersions(id);
    if (versions.length === 0) {
      alert('No saved versions found for this resume. Version checkpoints are created automatically upon restores.');
      return;
    }
    
    const versionList = versions.map(v => 
      `Version ${v.version_number} - Saved on ${new Date(v.created_at).toLocaleString()}`
    ).join('\n');
    
    const choice = prompt(
      `Versions found for this resume:\n\n${versionList}\n\nEnter a Version Number to restore (e.g. 1):`
    );
    
    if (choice) {
      const verNo = parseInt(choice);
      const targetVersion = versions.find(v => v.version_number === verNo);
      if (!targetVersion) {
        alert('Invalid version number selected.');
        return;
      }
      if (confirm(`Are you sure you want to restore Version ${verNo}? Your current resume state will be safely saved as a new version checkpoint.`)) {
        const restoreRes = await ApiService.resumes.restoreVersion(id, targetVersion.id);
        alert(restoreRes.message);
        window.location.reload();
      }
    }
  } catch (err) {
    alert('Failed to fetch versions: ' + err.message);
  }
}

// Delete resume
async function deleteResume(id) {
  if (confirm('Are you sure you want to delete this resume? This action is irreversible.')) {
    try {
      await ApiService.resumes.remove(id);
      loadDashboard();
    } catch (err) {
      alert('Delete failed: ' + err.message);
    }
  }
}

// Completeness score calculator
function calculateCompleteness(content) {
  if (!content) return 0;
  let score = 0;
  
  // Personal Info details: name, headline, email, phone, location
  const p = content.personal || {};
  if (p.fullName) score += 20;
  if (p.headline) score += 10;
  if (p.email) score += 10;
  if (p.phone) score += 5;
  if (p.location) score += 5;
  
  // Sections completed
  if (content.summary && content.summary.trim().length > 10) score += 15;
  if (content.experience && content.experience.length > 0) score += 15;
  if (content.education && content.education.length > 0) score += 10;
  if (content.skills && content.skills.trim().length > 5) score += 10;
  
  return Math.min(score, 100);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

loadDashboard();
</script>
<a href="../index.html" class="global-back-btn" aria-label="Back to Home" title="Back to Home"><i class="fa-solid fa-house"></i></a>
</body>
</html>
