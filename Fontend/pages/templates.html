<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Templates — ResumeForge</title>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Styles -->
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/app-shell.css" />
  <style>
    .tpl-hero {
      text-align: center;
      margin-bottom: var(--sp-5);
      background: var(--paper-0);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--sp-5);
      box-shadow: var(--shadow-sm);
    }
    .tpl-hero h2 { font-size: var(--fs-lg); color: var(--ink-950); margin-bottom: var(--sp-1); font-weight: 800; }
    .tpl-hero p { color: var(--ink-600); font-size: var(--fs-sm); max-width: 500px; margin: 0 auto; }

    /* Filter tabs */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: var(--sp-4) auto 0; }
    .filter-btn {
      padding: 6px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      font-size: var(--fs-2xs);
      font-weight: 600;
      cursor: pointer;
      background: var(--paper-0);
      color: var(--ink-700);
      transition: all var(--dur-fast) var(--ease-out);
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--signal-100);
      color: var(--primary);
      border-color: rgba(37, 99, 235, 0.15);
    }

    /* Grid */
    .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--sp-5);
      padding: var(--sp-4) 0 var(--sp-6);
    }

    /* Card */
    .tpl-card {
      background: var(--paper-0);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: all var(--dur-base) var(--ease-out);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tpl-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }
    .tpl-card.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--signal-100), var(--shadow-md);
    }
    .tpl-card.selected::after {
      content: '\f058';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 20px;
      color: var(--primary);
      z-index: 10;
      background: var(--paper-0);
      border-radius: 50%;
      line-height: 1;
    }

    .tpl-thumb {
      height: 200px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tpl-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--score-high-bg);
      color: var(--score-high);
      font-size: 10px;
      font-weight: 700;
      z-index: 5;
    }

    .tpl-mock {
      width: 72%;
      background: #FFFFFF;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-xs);
      padding: 12px;
      box-shadow: var(--shadow-sm);
      font-size: 6px;
      line-height: 1.5;
      color: #1E293B;
    }
    .tpl-mock-header { height: 16px; border-radius: 2px; margin-bottom: 6px; }
    .tpl-mock-line { height: 3px; background: #F1F5F9; border-radius: var(--radius-pill); margin-bottom: 4px; }
    .tpl-mock-line.short { width: 60%; }
    .tpl-mock-line.xshort { width: 40%; }
    .tpl-mock-line.accent { height: 1px; margin: 4px 0; }
    .tpl-mock-name { font-weight: 800; font-size: 8px; margin-bottom: 1px; color: #0F172A; }
    .tpl-mock-sub { font-size: 6px; color: #475569; margin-bottom: 4px; }
    .tpl-mock-section { font-size: 5.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin: 4px 0 2px; }

    .tpl-info {
      padding: var(--sp-4);
      border-top: 1px solid var(--line);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .tpl-info h3 {
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--ink-950);
      margin-bottom: 4px;
    }

    .tpl-info p {
      font-size: var(--fs-2xs);
      color: var(--ink-600);
      line-height: 1.4;
      margin-bottom: var(--sp-3);
    }

    .tpl-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed var(--line);
      padding-top: 10px;
      margin-top: auto;
    }

    .tpl-score {
      font-size: var(--fs-3xs);
      font-weight: 600;
      color: var(--score-high);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tpl-cat {
      font-size: var(--fs-3xs);
      color: var(--ink-600);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="appShellRoot"></div>

  <template id="templatesTemplate">
    <div class="tpl-hero">
      <h2>ATS-Vetted Design Layouts</h2>
      <p>Choose from our ATS-vetted layouts to present your development qualifications with confidence.</p>

      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all">All Styles</button>
        <button class="filter-btn" data-filter="classic ats">Classic ATS</button>
        <button class="filter-btn" data-filter="modern">Modern</button>
        <button class="filter-btn" data-filter="technical">Technical</button>
        <button class="filter-btn" data-filter="fresher">Fresher</button>
        <button class="filter-btn" data-filter="executive">Executive</button>
      </div>
    </div>

    <div class="templates-grid" id="templatesGrid"></div>
  </template>

  <a href="../index.html" class="global-back-btn" aria-label="Back to Home" title="Back to Home"><i class="fa-solid fa-house"></i></a>

  <script src="../js/services/api-service.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/components/app-shell.js"></script>
  <script>
    AppShell.render({ active: 'templates', title: 'Templates' });
    const content = document.getElementById('appContent');
    content.appendChild(document.getElementById('templatesTemplate').content.cloneNode(true));

    
    const templatesList = [
      // ATS-Friendly
      { id: 'classic-ats', name: 'Classic ATS', description: 'Standard ATS-friendly block layout with high readability.', category: 'Classic ATS' },
      { id: 'minimal-ats', name: 'Minimal ATS', description: 'Very clean, no borders, left-aligned standard layout.', category: 'Classic ATS' },
      { id: 'corporate-ats', name: 'Corporate ATS', description: 'Heavy lines and clearly defined structured headers.', category: 'Classic ATS' },
      { id: 'clean-ats', name: 'Clean ATS', description: 'Spacious, light lines, and ATS parsed safely.', category: 'Classic ATS' },
      { id: 'professional-ats', name: 'Professional ATS', description: 'Centered header with standard structured body.', category: 'Classic ATS' },
      // Modern
      { id: 'modern-professional', name: 'Modern Professional', description: 'Left sidebar for skills/contact with clean right body.', category: 'Modern' },
      { id: 'modern-minimal', name: 'Modern Minimal', description: 'Grid-based header with minimal structured body.', category: 'Modern' },
      { id: 'contemporary', name: 'Contemporary', description: 'Right sidebar layout for a fresh look.', category: 'Modern' },
      { id: 'clean-modern', name: 'Clean Modern', description: 'Compact right-aligned header with inline skills.', category: 'Modern' },
      // Technical
      { id: 'technical', name: 'Technical', description: 'Monospace elements optimized for tech roles.', category: 'Technical' },
      { id: 'software-engineer', name: 'Software Engineer', description: 'Code-like brackets and clean developer layout.', category: 'Technical' },
      { id: 'developer', name: 'Developer', description: 'Compact layout optimized for long tech stacks.', category: 'Technical' },
      { id: 'data-analytics', name: 'Data/Analytics', description: 'Table-like grid structure for analytical skills.', category: 'Technical' },
      { id: 'engineering', name: 'Engineering', description: 'Strict block layout for traditional engineering.', category: 'Technical' },
      // Fresher / Student
      { id: 'fresher', name: 'Fresher', description: 'Focus on education and academic projects.', category: 'Fresher' },
      { id: 'graduate', name: 'Graduate', description: 'Academic style for recent grads.', category: 'Fresher' },
      { id: 'student-professional', name: 'Student Professional', description: 'Compact clean layout bridging school to work.', category: 'Fresher' },
      // Executive
      { id: 'executive', name: 'Executive', description: 'Heavy serif, conservative classic layout.', category: 'Executive' },
      { id: 'senior-professional', name: 'Senior Professional', description: 'Two column top header for dense experience.', category: 'Executive' },
      { id: 'leadership', name: 'Leadership', description: 'Bold, authoritative layout for management.', category: 'Executive' }
    ];

    function renderCard(t) {
      const isSelected = t.id === currentTpl;
      return \`
        <div class="tpl-card \${isSelected ? 'selected' : ''}" data-category="\${t.category}" id="tpl_card_\${t.id}">
          <div class="tpl-thumb">
            <!-- A4 miniature CSS render -->
            <div class="tpl-mock">
              <div class="tpl-mock-header"></div>
              <div class="tpl-mock-name">\${t.name}</div>
              <div class="tpl-mock-sub">Layout Structure Preview</div>
              <div class="tpl-mock-line accent"></div>
              <div class="tpl-mock-section">Experience</div>
              <div class="tpl-mock-line"></div><div class="tpl-mock-line short"></div>
              <div class="tpl-mock-section" style="margin-top:8px">Education</div>
              <div class="tpl-mock-line short"></div>
            </div>
          </div>
          <div class="tpl-info">
            <h3>\${t.name}</h3>
            <p>\${t.description}</p>
            <div class="tpl-meta" style="margin-bottom: 12px;">
              <span class="tpl-score"><i class="fa-solid fa-check-circle"></i> 99% ATS</span>
              <span class="tpl-cat">\${t.category}</span>
            </div>
            <button type="button" class="btn btn-sm btn-block select-tpl-btn \${isSelected ? 'btn-primary' : 'btn-ghost'}" data-id="\${t.id}" data-name="\${t.name}">
              \${isSelected ? '<i class="fa-solid fa-circle-check"></i> Currently Active' : 'Select Template'}
            </button>
          </div>
        </div>\`;
    }

    async function loadTemplates() {
      const grid = document.getElementById('templatesGrid');
      grid.innerHTML = templatesList.map(renderCard).join('');
    }

    loadTemplates();

      // Provide user feedback and offer redirect
      const toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--primary);color:#fff;padding:12px 24px;border-radius:var(--radius-md);box-shadow:var(--shadow-lg);z-index:9999;font-size:var(--fs-xs);font-weight:600;display:flex;align-items:center;gap:12px;animation:fadeInUp 0.3s ease;';
      toast.innerHTML = `<span><i class="fa-solid fa-circle-check"></i> ${templateName} Layout selected!</span><a href="resume-builder.html" class="btn btn-sm" style="background:#fff;color:var(--primary);padding:4px 8px;font-size:10px;">Go to Builder</a>`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    });

    // Filter tabs
    document.getElementById('filterBar').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.dataset.filter.toLowerCase();
      document.querySelectorAll('.tpl-card').forEach(card => {
        const cat = card.dataset.category.toLowerCase();
        card.style.display = (filter === 'all' || cat === filter) ? '' : 'none';
      });
    });

    loadTemplates();
  </script>
</body>
</html>
