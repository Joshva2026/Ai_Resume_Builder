<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Templates — ResumeForge</title>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Styles -->
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/app-shell.css" />
  <style>
    .tpl-hero {
      text-align: center;
      margin-bottom: var(--sp-5);
      background: var(--paper-0);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--sp-5);
      box-shadow: var(--shadow-sm);
    }
    .tpl-hero h2 { font-size: var(--fs-lg); color: var(--ink-950); margin-bottom: var(--sp-1); font-weight: 800; }
    .tpl-hero p { color: var(--ink-600); font-size: var(--fs-sm); max-width: 500px; margin: 0 auto; }

    /* Filter tabs */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: var(--sp-4) auto 0; }
    .filter-btn {
      padding: 6px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      font-size: var(--fs-2xs);
      font-weight: 600;
      cursor: pointer;
      background: var(--paper-0);
      color: var(--ink-700);
      transition: all var(--dur-fast) var(--ease-out);
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--signal-100);
      color: var(--primary);
      border-color: rgba(37, 99, 235, 0.15);
    }

    /* Grid */
    .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--sp-5);
      padding: var(--sp-4) 0 var(--sp-6);
    }

    /* Card */
    .tpl-card {
      background: var(--paper-0);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: all var(--dur-base) var(--ease-out);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tpl-card:hover { 
      transform: translateY(-4px); 
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }

    .tpl-thumb {
      height: 200px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .tpl-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--score-high-bg);
      color: var(--score-high);
      font-size: 10px;
      font-weight: 700;
      z-index: 5;
    }

    .tpl-mock {
      width: 72%;
      background: #FFFFFF;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-xs);
      padding: 12px;
      box-shadow: var(--shadow-sm);
      font-size: 6px;
      line-height: 1.5;
      color: #1E293B;
    }
    .tpl-mock-header { height: 16px; border-radius: 2px; margin-bottom: 6px; }
    .tpl-mock-line { height: 3px; background: #F1F5F9; border-radius: var(--radius-pill); margin-bottom: 4px; }
    .tpl-mock-line.short { width: 60%; }
    .tpl-mock-line.xshort { width: 40%; }
    .tpl-mock-line.accent { height: 1px; margin: 4px 0; }
    .tpl-mock-name { font-weight: 800; font-size: 8px; margin-bottom: 1px; color: #0F172A; }
    .tpl-mock-sub { font-size: 6px; color: #475569; margin-bottom: 4px; }
    .tpl-mock-section { font-size: 5.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin: 4px 0 2px; }

    /* Hover overlay */
    .tpl-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 8;
    }
    .tpl-card:hover .tpl-overlay { opacity: 1; }

    .tpl-info {
      padding: var(--sp-4);
      border-top: 1px solid var(--line);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    .tpl-info h3 {
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--ink-950);
      margin-bottom: 4px;
    }
    
    .tpl-info p {
      font-size: var(--fs-2xs);
      color: var(--ink-600);
      line-height: 1.4;
      margin-bottom: var(--sp-3);
    }

    .tpl-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed var(--line);
      padding-top: 10px;
      margin-top: auto;
    }

    .tpl-score {
      font-size: var(--fs-3xs);
      font-weight: 600;
      color: var(--score-high);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tpl-cat {
      font-size: var(--fs-3xs);
      color: var(--ink-600);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="appShellRoot"></div>

  <template id="templatesTemplate">
    <div class="tpl-hero">
      <h2>Recruiter-Approved Design Layouts</h2>
      <p>Choose from our ATS-vetted layouts to present your development qualifications with confidence.</p>
      
      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all">All Styles</button>
        <button class="filter-btn" data-filter="Modern">Modern</button>
        <button class="filter-btn" data-filter="Classic">Classic</button>
        <button class="filter-btn" data-filter="Minimalist">Minimalist</button>
        <button class="filter-btn" data-filter="Academic">Academic</button>
      </div>
    </div>

    <div class="templates-grid" id="templatesGrid"></div>
  </template>

  <a href="../index.html" class="global-back-btn" aria-label="Back to Home" title="Back to Home"><i class="fa-solid fa-house"></i></a>

  <script src="../js/services/api-service.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/components/app-shell.js"></script>
  <script>
    AppShell.render({ active: 'templates', title: 'Templates' });
    const content = document.getElementById('appContent');
    content.appendChild(document.getElementById('templatesTemplate').content.cloneNode(true));

    function buildMock(t) {
      const accent = t.accent || '#2563EB';
      const cat = (t.category || '').toLowerCase();
      
      if (cat === 'classic') {
        return `<div class="tpl-mock">
          <div style="text-align:center;border-bottom:1px solid ${accent};padding-bottom:4px;margin-bottom:6px;">
            <div class="tpl-mock-name">Jane Doe</div>
            <div class="tpl-mock-sub">Senior Developer</div>
          </div>
          <div class="tpl-mock-section" style="color:${accent};text-align:center;">Experience</div>
          <div class="tpl-mock-line"></div><div class="tpl-mock-line short" style="margin:0 auto 4px auto;"></div>
        </div>`;
      }
      if (cat === 'minimalist') {
        return `<div class="tpl-mock">
          <div class="tpl-mock-name" style="font-size:7px;margin-bottom:0;">Jane Doe</div>
          <div class="tpl-mock-sub" style="font-size:5px;margin-bottom:4px;color:${accent}">UX Designer</div>
          <div class="tpl-mock-section" style="color:#0f172a;border:none;margin-top:2px;">Summary</div>
          <div class="tpl-mock-line"></div><div class="tpl-mock-line short"></div>
        </div>`;
      }
      if (cat === 'academic') {
        return `<div class="tpl-mock" style="line-height:1.3;">
          <div class="tpl-mock-name">Jane Doe</div>
          <div class="tpl-mock-sub">Research Assistant</div>
          <div class="tpl-mock-line accent" style="background:#475569;"></div>
          <div class="tpl-mock-section" style="color:#0F172A;border-bottom:0.5px solid #CBD5E1;">Publications</div>
          <div class="tpl-mock-line"></div><div class="tpl-mock-line short"></div>
        </div>`;
      }
      // default / modern
      return `<div class="tpl-mock">
        <div class="tpl-mock-header" style="background:${accent};"></div>
        <div class="tpl-mock-name">Jane Doe</div>
        <div class="tpl-mock-sub">Senior Software Developer</div>
        <div class="tpl-mock-line accent" style="background:${accent};opacity:0.4;"></div>
        <div class="tpl-mock-section" style="color:${accent};">Experience</div>
        <div class="tpl-mock-line"></div><div class="tpl-mock-line short"></div>
      </div>`;
    }

    function renderCard(t) {
      // Map templates to distinct accent mockups
      const colors = { 1: '#2563EB', 2: '#1D4ED8', 3: '#475569', 4: '#0D9488' };
      t.accent = colors[t.id] || '#2563EB';
      
      return `
        <div class="tpl-card" data-category="${t.category}">
          <div class="tpl-thumb" style="background:${t.accent}10;">
            <div class="tpl-badge">${t.atsScore || 95}% ATS</div>
            ${buildMock(t)}
            <div class="tpl-overlay">
              <a href="resume-builder.html?template=${t.id}" class="btn btn-primary btn-sm">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Use Layout
              </a>
            </div>
          </div>
          <div class="tpl-info">
            <h3>${t.name} Layout</h3>
            <p>${t.description}</p>
            <div class="tpl-meta">
              <span class="tpl-score"><i class="fa-solid fa-check-circle"></i> Vetted Score</span>
              <span class="tpl-cat">${t.category}</span>
            </div>
          </div>
        </div>`;
    }

    async function loadTemplates() {
      const grid = document.getElementById('templatesGrid');
      try {
        const templates = await ApiService.templates.list();
        grid.innerHTML = templates.map(renderCard).join('');
      } catch(e) {
        console.warn('Error loading templates:', e);
        grid.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--ink-400);">
            <i class="fa-solid fa-plug-circle-xmark fa-2x" style="margin-bottom:12px;display:block;color:var(--score-low);"></i>
            Could not fetch layout templates list.
          </div>`;
      }
    }

    // Filter tabs
    document.getElementById('filterBar').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.dataset.filter.toLowerCase();
      document.querySelectorAll('.tpl-card').forEach(card => {
        const cat = card.dataset.category.toLowerCase();
        card.style.display = (filter === 'all' || cat === filter) ? '' : 'none';
      });
    });

    loadTemplates();
  </script>
</body>
</html>
