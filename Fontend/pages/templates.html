  <style>
    .tpl-hero {
      text-align: center;
      margin-bottom: var(--sp-5);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: var(--sp-5);
      box-shadow: var(--glass-shadow);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }
    .tpl-hero h2 { font-size: var(--fs-lg); color: var(--ink-950); margin-bottom: var(--sp-1); font-weight: 800; }
    .tpl-hero p { color: var(--ink-600); font-size: var(--fs-sm); max-width: 500px; margin: 0 auto; }

    /* Filter tabs */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: var(--sp-4) auto 0; }
    .filter-btn {
      padding: 6px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      font-size: var(--fs-2xs);
      font-weight: 600;
      cursor: pointer;
      background: var(--paper-0);
      color: var(--ink-700);
      transition: all var(--dur-fast) var(--ease-out);
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--signal-100);
      color: var(--primary);
      border-color: rgba(37, 99, 235, 0.15);
    }

    /* Grid */
    .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--sp-5);
      padding: var(--sp-4) 0 var(--sp-6);
    }

    /* Card */
    .tpl-card {
      background: var(--paper-0);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: all var(--dur-base) var(--ease-out);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tpl-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }
    .tpl-card.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--signal-100), var(--shadow-md);
    }
    .tpl-card.selected::after {
      content: '\f058';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 20px;
      color: var(--primary);
      z-index: 10;
      background: var(--paper-0);
      border-radius: 50%;
      line-height: 1;
    }

    .tpl-thumb {
      height: 200px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper-100);
      border-bottom: 1px solid var(--line);
    }

    .tpl-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--score-high-bg);
      color: var(--score-high);
      font-size: 10px;
      font-weight: 700;
      z-index: 5;
    }

    .tpl-mock {
      width: 72%;
      background: #FFFFFF;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-xs);
      padding: 12px;
      box-shadow: var(--shadow-sm);
      font-size: 6px;
      line-height: 1.5;
      color: #1E293B;
      transform: scale(0.8);
    }
    .tpl-mock-header { height: 16px; border-radius: 2px; margin-bottom: 6px; }
    .tpl-mock-line { height: 3px; background: #F1F5F9; border-radius: var(--radius-pill); margin-bottom: 4px; }
    .tpl-mock-line.short { width: 60%; }
    .tpl-mock-line.xshort { width: 40%; }
    .tpl-mock-line.accent { height: 1px; margin: 4px 0; }
    .tpl-mock-name { font-weight: 800; font-size: 8px; margin-bottom: 1px; color: #0F172A; }
    .tpl-mock-sub { font-size: 6px; color: #475569; margin-bottom: 4px; }
    .tpl-mock-section { font-size: 5.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin: 4px 0 2px; }

    .tpl-info {
      padding: var(--sp-4);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .tpl-info h3 {
      font-size: var(--fs-sm);
      font-weight: 800;
      color: var(--ink-950);
      margin-bottom: 4px;
    }

    .tpl-info p {
      font-size: var(--fs-2xs);
      color: var(--ink-600);
      line-height: 1.4;
      margin-bottom: var(--sp-3);
    }

    .tpl-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed var(--line);
      padding-top: 10px;
      margin-top: auto;
    }

    .tpl-score {
      font-size: var(--fs-3xs);
      font-weight: 600;
      color: var(--score-high);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tpl-cat {
      font-size: var(--fs-3xs);
      color: var(--ink-600);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(9, 9, 11, 0.7);
      backdrop-filter: blur(6px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: var(--sp-4);
    }

    .modal-card {
      width: 100%;
      max-width: 850px;
      background: var(--paper-0);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--ink-950);
    }

    .modal-header {
      padding: var(--sp-4) var(--sp-5);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--paper-50);
    }

    .modal-header h3 {
      margin: 0;
      font-size: var(--fs-md);
      font-weight: 800;
    }

    .modal-body {
      padding: var(--sp-5);
      overflow-y: auto;
      flex: 1;
      display: flex;
      justify-content: center;
      background: var(--paper-100);
    }

    .modal-footer {
      padding: var(--sp-4) var(--sp-5);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      background: var(--paper-50);
    }

    /* scale A4 mockup in preview modal to fit screen height */
    #tplPreviewPaper {
      zoom: 0.8;
      box-shadow: var(--shadow-md);
    }
    @media (max-width: 800px) {
      #tplPreviewPaper {
        zoom: 0.55;
      }
    }
    @media (max-width: 500px) {
      #tplPreviewPaper {
        zoom: 0.4;
      }
    }
  </style>

  <script>
    AppShell.render({ active: 'templates', title: 'Templates' });
    const content = document.getElementById('appContent');
    content.appendChild(document.getElementById('templatesTemplate').content.cloneNode(true));

    // Initialize Scroll-Controlled Template Showcase Engine
    function initTemplateShowcase() {
      const track = document.getElementById('cinematicShowcaseTrack');
      const slides = document.querySelectorAll('.cinematic-tpl-slide');
      const counter = document.getElementById('showcaseCounter');
      const nameTag = document.getElementById('counterTemplateName');

      if (!track || !slides.length) return;

      function handleShowcaseScroll() {
        const rect = track.getBoundingClientRect();
        const scrollable = rect.height - window.innerHeight;
        if (scrollable <= 0) return;
        let progress = Math.max(0, Math.min(1, -rect.top / scrollable));

        const total = slides.length;
        const activeFloat = progress * (total - 1);
        const activeIndex = Math.min(total - 1, Math.floor(activeFloat));

        if (counter && nameTag) {
          const activeSlide = slides[activeIndex];
          const name = activeSlide ? activeSlide.dataset.name : 'Classic ATS';
          counter.innerHTML = `0${activeIndex + 1} / 06 &bull; <span style="color:#FFF;">${name}</span>`;
        }

        slides.forEach((slide, i) => {
          const dist = i - activeFloat;
          if (Math.abs(dist) > 1.5) {
            slide.style.opacity = '0';
            slide.style.pointerEvents = 'none';
          } else if (dist === 0 || Math.abs(dist) < 0.5) {
            slide.style.opacity = '1';
            slide.style.transform = 'rotateY(0deg) scale(1) translate3d(0, 0, 80px)';
            slide.style.pointerEvents = 'auto';
          } else if (dist > 0) {
            const opacity = Math.max(0, 1 - dist);
            slide.style.opacity = opacity.toFixed(2);
            slide.style.transform = `rotateY(20deg) scale(${0.85 - dist * 0.1}) translate3d(${dist * 180}px, 0, ${-dist * 250}px)`;
            slide.style.pointerEvents = 'none';
          } else {
            const opacity = Math.max(0, 1 + dist);
            slide.style.opacity = opacity.toFixed(2);
            slide.style.transform = `rotateY(-20deg) scale(${0.85 + dist * 0.1}) translate3d(${dist * 180}px, 0, ${dist * 250}px)`;
            slide.style.pointerEvents = 'none';
          }
        });
      }

      window.addEventListener('scroll', () => requestAnimationFrame(handleShowcaseScroll), { passive: true });
      handleShowcaseScroll();
    }

    // Modal control event listeners
    document.getElementById('closeTplPreviewModal').addEventListener('click', () => {
      document.getElementById('tplPreviewModal').style.display = 'none';
    });
    document.getElementById('btnCancelTplPreview').addEventListener('click', () => {
      document.getElementById('tplPreviewModal').style.display = 'none';
    });

    let currentActiveTplId = 'classic-ats';

    function showTemplatePreviewModal(id, name) {
      currentActiveTplId = id;
      const modal = document.getElementById('tplPreviewModal');
      const title = document.getElementById('tplPreviewTitle');
      const paper = document.getElementById('tplPreviewPaper');
      
      if (!modal || !paper) return;
      
      title.textContent = `Preview: ${name} Template`;
      modal.style.display = 'flex';

      const sampleData = {
        personalInfo: { fullName: 'Alex Morgan', title: 'Senior Software Engineer', email: 'alex@dev.io', phone: '+1 (555) 019-2834', location: 'San Francisco, CA' },
        summary: 'Senior engineer specializing in high-throughput cloud services and ATS-compliant resume architecture.',
        experience: [{ title: 'Lead Platform Engineer', company: 'CloudScale Inc.', date: '2022 - Present', bullets: ['Architected streaming pipeline reducing latency by 42%.', 'Managed 12 microservices with 99.98% uptime.'] }],
        skills: 'TypeScript, React, Node.js, PostgreSQL, Docker, AWS',
        education: [{ degree: 'B.S. Computer Science', school: 'Tech University', date: '2018 - 2022' }]
      };

      if (typeof TemplateRenderer !== 'undefined' && TemplateRenderer.generateResumeHtml) {
        paper.innerHTML = TemplateRenderer.generateResumeHtml(sampleData, id);
      } else {
        paper.innerHTML = `<div style="padding:20px; color:#0F172A;"><h3>${name} Template</h3><p>Sample ATS Preview Content</p></div>`;
      }
    }

    document.addEventListener('click', (e) => {
      const prevBtn = e.target.closest('.preview-showcase-btn');
      const useBtn = e.target.closest('.use-showcase-btn');

      if (prevBtn) {
        showTemplatePreviewModal(prevBtn.dataset.id, prevBtn.dataset.name);
      }
      if (useBtn) {
        const id = useBtn.dataset.id;
        localStorage.setItem('rf_selected_template', id);
        window.location.href = 'resume-builder.html';
      }
    });

    document.getElementById('btnUseTplFromPreview').addEventListener('click', () => {
      localStorage.setItem('rf_selected_template', currentActiveTplId);
      window.location.href = 'resume-builder.html';
    });

    initTemplateShowcase();
  </script>
</body>
</html>
