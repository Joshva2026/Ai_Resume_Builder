<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant — ResumeForge</title>
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Styles -->
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/app-shell.css">
<link rel="stylesheet" href="../css/animations.css">
<style>
.assistant-container {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 120px);
  max-width: 1000px;
  margin: 0 auto;
  background: var(--paper-0);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.assistant-header {
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--line);
  background: var(--paper-50);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.assistant-header-info {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}

.assistant-avatar-badge {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: var(--primary);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}

.assistant-header h2 {
  font-size: var(--fs-base);
  font-weight: 700;
  margin: 0;
  color: var(--ink-950);
}

.assistant-header p {
  font-size: var(--fs-3xs);
  color: var(--ink-600);
  margin: 2px 0 0 0;
}

/* Quick Prompts Container */
.quick-prompts-wrapper {
  padding: var(--sp-3) var(--sp-4);
  background: var(--paper-50);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  white-space: nowrap;
  display: flex;
  gap: 8px;
  scrollbar-width: thin;
}

.prompt-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  background: var(--paper-0);
  border: 1px solid var(--line);
  color: var(--ink-700);
  font-size: var(--fs-2xs);
  font-weight: 600;
  cursor: pointer;
  transition: all var(--dur-fast) var(--ease-out);
  flex-shrink: 0;
}

.prompt-chip:hover {
  background: var(--signal-100);
  color: var(--primary);
  border-color: rgba(37, 99, 235, 0.15);
}

.prompt-chip i {
  color: var(--primary);
}

/* Chat Messages Scroll Area */
.chat-messages {
  flex: 1;
  padding: var(--sp-5);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  background: var(--paper-50);
}

.msg-row {
  display: flex;
  gap: var(--sp-3);
  max-width: 85%;
}

.msg-row.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}

.msg-row.assistant .msg-avatar {
  background: var(--primary);
  color: white;
}

.msg-row.user .msg-avatar {
  background: var(--paper-0);
  border: 1px solid var(--line-strong);
  color: var(--ink-950);
}

.msg-bubble {
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--radius-md);
  font-size: var(--fs-sm);
  line-height: 1.55;
  word-break: break-word;
  box-shadow: var(--shadow-sm);
}

.msg-row.assistant .msg-bubble {
  background: var(--paper-0);
  border: 1px solid var(--line);
  color: var(--ink-900);
  border-top-left-radius: 2px;
}

.msg-row.user .msg-bubble {
  background: var(--primary);
  color: white;
  border-top-right-radius: 2px;
}

.msg-bubble p { margin-bottom: 8px; }
.msg-bubble p:last-child { margin-bottom: 0; }
.msg-bubble ul, .msg-bubble ol { margin: 8px 0 8px 20px; }
.msg-bubble li { margin-bottom: 4px; }
.msg-bubble strong { font-weight: 700; }

/* Loading typing indicator */
.typing-indicator {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 10px 14px;
  background: var(--paper-0);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  border-top-left-radius: 2px;
  width: fit-content;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--primary);
  animation: typingBounce 1.4s infinite ease-in-out both;
}

.dot:nth-child(1) { animation-delay: -0.32s; }
.dot:nth-child(2) { animation-delay: -0.16s; }

@keyframes typingBounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

/* Chat Input Bar */
.chat-input-bar {
  padding: var(--sp-4);
  background: var(--paper-0);
  border-top: 1px solid var(--line);
  display: flex;
  gap: var(--sp-3);
  align-items: center;
}

.chat-input-wrapper {
  flex: 1;
  position: relative;
}

textarea#chatInput {
  width: 100%;
  min-height: 44px;
  max-height: 120px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: var(--fs-sm);
  resize: none;
  outline: none;
  background: var(--paper-0);
  color: var(--ink-950);
  transition: border-color var(--dur-fast);
}

textarea#chatInput:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--signal-100);
}

.send-btn {
  height: 44px;
  padding: 0 var(--sp-4);
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: var(--fs-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background var(--dur-fast);
}

.send-btn:hover {
  background: var(--primary-dark);
}

.send-btn:disabled {
  background: var(--paper-100);
  border: 1px solid var(--line);
  color: var(--ink-400);
  cursor: not-allowed;
  box-shadow: none;
}

.clear-btn {
  height: 44px;
  padding: 0 14px;
  background: var(--paper-0);
  border: 1px solid var(--line);
  color: var(--ink-600);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--dur-fast);
}

.clear-btn:hover {
  background: var(--paper-50);
  color: var(--score-low);
  border-color: rgba(220, 38, 38, 0.2);
}

/* Code block & styling */
.msg-bubble pre {
  background: #1E293B;
  padding: 12px;
  border-radius: 6px;
  overflow-x: auto;
  margin: 8px 0;
  border: 1px solid #334155;
  font-family: 'IBM Plex Mono', Courier, monospace;
  font-size: 11px;
  color: #E2E8F0;
}
.msg-bubble code {
  font-family: 'IBM Plex Mono', Courier, monospace;
  background: var(--paper-100);
  padding: 2px 4px;
  border-radius: 4px;
  font-size: 0.9em;
  color: var(--primary);
}
.msg-bubble pre code {
  background: transparent;
  padding: 0;
  color: inherit;
  font-size: inherit;
}

@media (max-width: 768px) {
  .assistant-container {
    height: calc(100vh - 100px);
    border-radius: 0;
    border: none;
  }
  .msg-row { max-width: 95%; }
}
</style>
</head>
<body>

<div id="appShellRoot"></div>

<template id="aiAssistantTemplate">
  <div class="assistant-container">
    <div class="assistant-header">
      <div class="assistant-header-info">
        <div class="assistant-avatar-badge"><i class="fa-solid fa-robot"></i></div>
        <div>
          <h2>AI Assistant</h2>
          <p>Ask anything about resume writing, ATS optimization, and career growth.</p>
        </div>
      </div>
      <button class="clear-btn" id="clearChatBtn" title="Clear chat history"><i class="fa-solid fa-trash-can"></i></button>
    </div>

    <!-- Quick Action Prompts -->
    <div class="quick-prompts-wrapper">
      <button class="prompt-chip" data-prompt="How can I improve my resume for a software developer job?"><i class="fa-solid fa-wand-magic-sparkles"></i> Improve My Resume</button>
      <button class="prompt-chip" data-prompt="How do I improve my ATS score to pass keyword filters?"><i class="fa-solid fa-gauge-high"></i> Improve ATS Score</button>
      <button class="prompt-chip" data-prompt="Write a compelling professional summary for my resume."><i class="fa-solid fa-pen-nib"></i> Write Summary</button>
      <button class="prompt-chip" data-prompt="Generate 5 strong bullet points with metrics for a software engineer."><i class="fa-solid fa-list-check"></i> Generate Bullet Points</button>
      <button class="prompt-chip" data-prompt="What are the top technical & soft skills I should list on my resume?"><i class="fa-solid fa-lightbulb"></i> Suggest Skills</button>
      <button class="prompt-chip" data-prompt="Review my profile bio and suggest improvements."><i class="fa-solid fa-user-check"></i> Review My Profile</button>
    </div>

    <!-- Chat Messages -->
    <div class="chat-messages" id="chatMessages">
      <div class="msg-row assistant">
        <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
        <div class="msg-bubble">
          <p>Hello! I am your <strong>ResumeForge AI Assistant</strong>. How can I help you today?</p>
          <p>You can pick a quick topic above or type any question about your resume, ATS match, or career goals below!</p>
        </div>
      </div>
    </div>

    <!-- Chat Input -->
    <div class="chat-input-bar">
      <div class="chat-input-wrapper">
        <textarea id="chatInput" placeholder="Ask about resume tips, bullet points, or career advice..." rows="1"></textarea>
      </div>
      <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i> Send</button>
    </div>
  </div>
</template>

<script src="../js/services/api-service.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/components/app-shell.js"></script>
<script>
AppShell.render({ active: 'ai-assistant', title: 'AI Assistant' });
const content = document.getElementById('appContent');
content.appendChild(document.getElementById('aiAssistantTemplate').content.cloneNode(true));
</script>
<script src="../js/pages/ai-assistant.js"></script>
<a href="../index.html" class="global-back-btn" aria-label="Back to Home" title="Back to Home"><i class="fa-solid fa-house"></i></a>
</body>
</html>
