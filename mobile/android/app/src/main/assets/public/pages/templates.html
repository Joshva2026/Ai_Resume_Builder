<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Styles -->
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/app-shell.css" />
  <link rel="stylesheet" href="../css/templates.css" />
  <style>
    .tpl-hero {
      text-align: center;
      margin-bottom: var(--sp-5);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: var(--sp-5);
      box-shadow: var(--glass-shadow);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }
    .tpl-hero h2 { font-size: var(--fs-lg); color: var(--ink-950); margin-bottom: var(--sp-1); font-weight: 800; }
    .tpl-hero p { color: var(--ink-600); font-size: var(--fs-sm); max-width: 500px; margin: 0 auto; }

    /* Filter tabs */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: var(--sp-4) auto 0; }
    .filter-btn {
      padding: 6px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      font-size: var(--fs-2xs);
      font-weight: 600;
      cursor: pointer;
      background: var(--paper-0);
      color: var(--ink-700);
      transition: all var(--dur-fast) var(--ease-out);
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--signal-100);
      color: var(--primary);
      border-color: rgba(37, 99, 235, 0.15);
    }

    /* Grid */
    .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--sp-5);
      padding: var(--sp-4) 0 var(--sp-6);
    }

    /* Card */
    .tpl-card {
      background: var(--paper-0);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: all var(--dur-base) var(--ease-out);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tpl-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }
    .tpl-card.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--signal-100), var(--shadow-md);
    }
    .tpl-card.selected::after {
      content: '\f058';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 20px;
      color: var(--primary);
      z-index: 10;
      background: var(--paper-0);
      border-radius: 50%;
      line-height: 1;
    }

    .tpl-thumb {
      height: 200px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper-100);
      border-bottom: 1px solid var(--line);
    }

    .tpl-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--score-high-bg);
      color: var(--score-high);
      font-size: 10px;
      font-weight: 700;
      z-index: 5;
    }

    .tpl-mock {
      width: 72%;
      background: #FFFFFF;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-xs);
      padding: 12px;
      box-shadow: var(--shadow-sm);
      font-size: 6px;
      line-height: 1.5;
      color: #1E293B;
      transform: scale(0.8);
    }
    .tpl-mock-header { height: 16px; border-radius: 2px; margin-bottom: 6px; }
    .tpl-mock-line { height: 3px; background: #F1F5F9; border-radius: var(--radius-pill); margin-bottom: 4px; }
    .tpl-mock-line.short { width: 60%; }
    .tpl-mock-line.xshort { width: 40%; }
    .tpl-mock-line.accent { height: 1px; margin: 4px 0; }
    .tpl-mock-name { font-weight: 800; font-size: 8px; margin-bottom: 1px; color: #0F172A; }
    .tpl-mock-sub { font-size: 6px; color: #475569; margin-bottom: 4px; }
    .tpl-mock-section { font-size: 5.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin: 4px 0 2px; }

    .tpl-info {
      padding: var(--sp-4);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .tpl-info h3 {
      font-size: var(--fs-sm);
      font-weight: 800;
      color: var(--ink-950);
      margin-bottom: 4px;
    }

    .tpl-info p {
      font-size: var(--fs-2xs);
      color: var(--ink-600);
      line-height: 1.4;
      margin-bottom: var(--sp-3);
    }

    .tpl-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed var(--line);
      padding-top: 10px;
      margin-top: auto;
    }

    .tpl-score {
      font-size: var(--fs-3xs);
      font-weight: 600;
      color: var(--score-high);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tpl-cat {
      font-size: var(--fs-3xs);
      color: var(--ink-600);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(9, 9, 11, 0.7);
      backdrop-filter: blur(6px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: var(--sp-4);
    }

    .modal-card {
      width: 100%;
      max-width: 850px;
      background: var(--paper-0);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--ink-950);
    }

    .modal-header {
      padding: var(--sp-4) var(--sp-5);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--paper-50);
    }

    .modal-header h3 {
      margin: 0;
      font-size: var(--fs-md);
      font-weight: 800;
    }

    .modal-body {
      padding: var(--sp-5);
      overflow-y: auto;
      flex: 1;
      display: flex;
      justify-content: center;
      background: var(--paper-100);
    }

    .modal-footer {
      padding: var(--sp-4) var(--sp-5);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      background: var(--paper-50);
    }

    /* scale A4 mockup in preview modal to fit screen height */
    #tplPreviewPaper {
      zoom: 0.8;
      box-shadow: var(--shadow-md);
    }
    @media (max-width: 800px) {
      #tplPreviewPaper {
        zoom: 0.55;
      }
    }
    @media (max-width: 500px) {
      #tplPreviewPaper {
        zoom: 0.4;
      }
    }
  </style>

<title>Resume Templates — ResumeForge</title>
<meta name="description" content="Browse professional, ATS-friendly resume templates.">
<link rel="canonical" href="https://ai-resume-builder-rb1m.onrender.com/pages/templates.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Resume Templates — ResumeForge">
<meta property="og:description" content="Browse professional, ATS-friendly resume templates.">
<meta property="og:url" content="https://ai-resume-builder-rb1m.onrender.com/pages/templates.html">
<meta property="og:site_name" content="ResumeForge">
<meta property="og:image" content="https://ai-resume-builder-rb1m.onrender.com/assets/images/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Resume Templates — ResumeForge">
<meta name="twitter:description" content="Browse professional, ATS-friendly resume templates.">
<meta name="twitter:image" content="https://ai-resume-builder-rb1m.onrender.com/assets/images/og-image.jpg">
<link rel="icon" href="/favicon.ico">
</head>
<body>
  <div id="appShellRoot"></div>

  <template id="templatesTemplate">
    <div class="tpl-hero">
      <h2>Resume Templates</h1>
      <p>Choose a professional ATS-friendly template for your next application.</p>

      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all">All Templates</button>
        <button class="filter-btn" data-filter="ats-friendly">ATS Friendly</button>
        <button class="filter-btn" data-filter="modern">Modern</button>
        <button class="filter-btn" data-filter="professional">Professional</button>
        <button class="filter-btn" data-filter="technical">Technical</button>
        <button class="filter-btn" data-filter="fresher">Fresher</button>
        <button class="filter-btn" data-filter="minimal">Minimal</button>
        <button class="filter-btn" data-filter="corporate">Corporate</button>
      </div>
    </div>

    <div class="templates-grid" id="templatesGrid"></div>
  </template>

  <!-- Template Preview Modal -->
  <div id="tplPreviewModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="tplPreviewTitle">Template Preview</h3>
        <button type="button" class="btn-close" id="closeTplPreviewModal" style="background:none; border:none; font-size:16px; color:var(--ink-600); cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="paper" id="tplPreviewPaper"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="btnCancelTplPreview">Close</button>
        <button type="button" class="btn btn-primary" id="btnUseTplFromPreview">Use Template</button>
      </div>
    </div>
  </div>

  <a href="../index.html" class="global-back-btn" aria-label="Back to Home" title="Back to Home"><i class="fa-solid fa-house"></i></a>

  <script src="../js/services/api-service.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/services/template-renderer.js"></script>
  <script src="../js/components/app-shell.js"></script>
  <script>
    AppShell.render({ active: 'templates', title: 'Templates' });
    const content = document.getElementById('appContent');
    content.appendChild(document.getElementById('templatesTemplate').content.cloneNode(true));

    function buildMock(t) {
      const accent = '#111111'; // Pure professional dark
      const cat = (t.category || '').toLowerCase();

      if (cat === 'classic ats') {
        return `<div class="tpl-mock">
          <div style="text-align:center;border-bottom:1px solid ${accent};padding-bottom:4px;margin-bottom:6px;">
            <div class="tpl-mock-name">Jane Doe</div>
            <div class="tpl-mock-sub">Senior Developer</div>
          </div>
          <div class="tpl-mock-section" style="color:${accent};text-align:center;">Experience</div>
          <div class="tpl-mock-line"></div><div class="tpl-mock-line short" style="margin:0 auto 4px auto;"></div>
        </div>`;
      }
      if (cat === 'minimalist' || t.id.includes('minimal')) {
        return `<div class="tpl-mock">
          <div class="tpl-mock-name" style="font-size:7px;margin-bottom:0;">Jane Doe</div>
          <div class="tpl-mock-sub" style="font-size:5px;margin-bottom:4px;color:${accent}">UX Designer</div>
          <div class="tpl-mock-section" style="color:#111;border:none;margin-top:2px;">Summary</div>
          <div class="tpl-mock-line"></div><div class="tpl-mock-line short"></div>
        </div>`;
      }
      if (cat === 'academic' || t.id.includes('academic')) {
        return `<div class="tpl-mock" style="line-height:1.3;">
          <div class="tpl-mock-name">Jane Doe</div>
          <div class="tpl-mock-sub">Research Assistant</div>
          <div class="tpl-mock-line accent" style="background:#475569;"></div>
          <div class="tpl-mock-section" style="color:#111;border-bottom:0.5px solid #CBD5E1;">Publications</div>
          <div class="tpl-mock-line"></div><div class="tpl-mock-line short"></div>
        </div>`;
      }
      // default / modern
      return `<div class="tpl-mock">
        <div class="tpl-mock-header" style="background:${accent};"></div>
        <div class="tpl-mock-name">Jane Doe</div>
        <div class="tpl-mock-sub">Senior Software Developer</div>
        <div class="tpl-mock-line accent" style="background:${accent};opacity:0.4;"></div>
        <div class="tpl-mock-section" style="color:${accent};">Experience</div>
        <div class="tpl-mock-line"></div><div class="tpl-mock-line short"></div>
      </div>`;
    }

    let currentTpl = localStorage.getItem('rf_selected_template') || 'classic-ats';

    // Synchronize active template based on current builder draft
    const draftStr = localStorage.getItem('rf_draft');
    if (draftStr) {
      try {
        const draft = JSON.parse(draftStr);
        if (draft.styling && draft.styling.template) {
          currentTpl = draft.styling.template;
        }
      } catch (e) {}
    }

    function renderCard(t) {
      if (!t.category) t.category = 'Modern';
      const isSelected = t.id === currentTpl;

      return `
        <div class="tpl-card ${isSelected ? 'selected' : ''}" data-category="${t.category}" id="tpl_card_${t.id}">
          <div class="tpl-thumb">
            <div class="tpl-badge">${t.atsScore || 95}% ATS</div>
            ${buildMock(t)}
          </div>
          <div class="tpl-info">
            <h3>${t.name} Layout</h3>
            <p>${t.description}</p>
            <div class="tpl-meta" style="margin-bottom: 12px;">
              <span class="tpl-score"><i class="fa-solid fa-gauge-high"></i> Vetted Score</span>
              <span class="tpl-cat">${t.category}</span>
            </div>
            <div style="display:flex; gap:8px;">
              <button type="button" class="btn btn-xs btn-ghost preview-tpl-btn" style="flex:1" data-id="${t.id}" data-name="${t.name}">
                <i class="fa-solid fa-eye"></i> Preview
              </button>
              <button type="button" class="btn btn-xs btn-primary use-tpl-btn" style="flex:1" data-id="${t.id}" data-name="${t.name}">
                <i class="fa-solid fa-circle-check"></i> Use Template
              </button>
            </div>
          </div>
        </div>`;
    }

    async function loadTemplates() {
      const grid = document.getElementById('templatesGrid');
      try {
        let templates = [];
        if (typeof TemplateRenderer !== 'undefined' && TemplateRenderer.templatesList) {
          templates = TemplateRenderer.templatesList;
        } else {
          templates = await ApiService.templates.list();
        }
        grid.innerHTML = templates.map(renderCard).join('');
      } catch(e) {
        console.warn('Error loading templates:', e);
        grid.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--ink-400);">
            <i class="fa-solid fa-plug-circle-xmark fa-2x" style="margin-bottom:12px;display:block;color:var(--score-low);"></i>
            Could not fetch layout templates list.
          </div>`;
      }
    }

    // Modal control event listeners
    document.getElementById('closeTplPreviewModal').addEventListener('click', () => {
      document.getElementById('tplPreviewModal').style.display = 'none';
    });
    document.getElementById('btnCancelTplPreview').addEventListener('click', () => {
      document.getElementById('tplPreviewModal').style.display = 'none';
    });

    function showTemplatePreviewModal(id, name) {
      const modal = document.getElementById('tplPreviewModal');
      const title = document.getElementById('tplPreviewTitle');
      const paper = document.getElementById('tplPreviewPaper');
      
      if (!modal || !paper) return;
      
      title.textContent = `Preview: ${name} Template`;
      modal.style.display = 'flex';
      
      if (typeof TemplateRenderer !== 'undefined') {
        const mockData = getMockResumeData();
        const result = TemplateRenderer.generateResumeHtml(mockData, id);
        
        paper.innerHTML = result.html;
        paper.className = `paper template-${id}`;
        
        const fontStr = result.styling.font === 'serif' ? 'Georgia, serif' : result.styling.font === 'mono' ? '"IBM Plex Mono", monospace' : 'Inter, sans-serif';
        
        paper.style.setProperty('--cv-font', fontStr);
        paper.style.setProperty('--cv-font-size', (result.styling.fontSize || 10) + 'pt');
        paper.style.setProperty('--cv-h1-size', ((result.styling.headingSize || 14) + 8) + 'pt');
        paper.style.setProperty('--cv-h2-size', (result.styling.headingSize || 14) + 'pt');
        paper.style.setProperty('--cv-h3-size', (result.styling.subheadingSize || 11) + 'pt');
        paper.style.setProperty('--cv-line-height', result.styling.lineSpacing || 1.5);
        paper.style.setProperty('--cv-margin', (result.styling.marginSize || 20) + 'mm');
        paper.style.setProperty('--cv-section-spacing', (result.styling.sectionSpacing || 12) + 'pt');
        paper.style.setProperty('--cv-p-spacing', (result.styling.pSpacing || 6) + 'pt');
      }
      
      const useBtnModal = document.getElementById('btnUseTplFromPreview');
      if (useBtnModal) {
        const newUseBtn = useBtnModal.cloneNode(true);
        useBtnModal.parentNode.replaceChild(newUseBtn, useBtnModal);
        newUseBtn.addEventListener('click', async () => {
          modal.style.display = 'none';
          await applyTemplateAndRedirect(id, name);
        });
      }
    }

    async function applyTemplateAndRedirect(templateId, templateName) {
      localStorage.setItem('rf_selected_template', templateId);
      currentTpl = templateId;

      // Update current general draft
      const draftStr = localStorage.getItem('rf_draft');
      if (draftStr) {
        try {
          const draft = JSON.parse(draftStr);
          draft.styling = draft.styling || {};
          draft.styling.template = templateId;
          localStorage.setItem('rf_draft', JSON.stringify(draft));
        } catch (err) {}
      }

      // Update all page-specific builder drafts
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key.startsWith('resume_builder_draft_')) {
            const dr = JSON.parse(localStorage.getItem(key));
            dr.styling = dr.styling || {};
            dr.styling.template = templateId;
            localStorage.setItem(key, JSON.stringify(dr));
          }
        }
      } catch (err) {}

      // Display redirection toast
      const toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--primary);color:#fff;padding:12px 24px;border-radius:var(--radius-md);box-shadow:var(--shadow-lg);z-index:9999;font-size:var(--fs-xs);font-weight:600;display:flex;align-items:center;gap:12px;animation:fadeInUp 0.3s ease;';
      toast.innerHTML = `<span><i class="fa-solid fa-circle-check"></i> ${templateName} Layout selected! Redirecting...</span>`;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.remove();
        window.location.href = 'resume-builder.html';
      }, 1200);
    }

    // Grid interaction listener
    document.getElementById('templatesGrid').addEventListener('click', async e => {
      const previewBtn = e.target.closest('.preview-tpl-btn');
      const useBtn = e.target.closest('.use-tpl-btn');

      if (previewBtn) {
        const id = previewBtn.dataset.id;
        const name = previewBtn.dataset.name;
        showTemplatePreviewModal(id, name);
      }

      if (useBtn) {
        const id = useBtn.dataset.id;
        const name = useBtn.dataset.name;
        await applyTemplateAndRedirect(id, name);
      }
    });

    // Categories filter tabs
    document.getElementById('filterBar').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.dataset.filter;
      
      document.querySelectorAll('.tpl-card').forEach(card => {
        const cat = card.dataset.category.toLowerCase();
        const name = card.querySelector('h3').textContent.toLowerCase();
        const desc = card.querySelector('p').textContent.toLowerCase();
        
        let show = false;
        if (filter === 'all') show = true;
        else if (filter === 'ats-friendly') show = cat.includes('classic') || name.includes('ats') || desc.includes('ats');
        else if (filter === 'modern') show = cat.includes('modern') || name.includes('modern') || desc.includes('modern');
        else if (filter === 'professional') show = cat.includes('executive') || name.includes('professional') || name.includes('corporate');
        else if (filter === 'technical') show = cat.includes('technical') || name.includes('software') || name.includes('developer') || name.includes('analytics');
        else if (filter === 'fresher') show = cat.includes('fresher') || name.includes('fresher') || name.includes('graduate') || name.includes('student');
        else if (filter === 'minimal') show = name.includes('minimal') || desc.includes('minimal') || desc.includes('clean');
        else if (filter === 'corporate') show = name.includes('corporate') || name.includes('executive') || name.includes('professional');
        
        card.style.display = show ? '' : 'none';
      });
    });

    function getMockResumeData() {
      return {
        personal: { fullName: 'Johnathan Doe', headline: 'Senior Software Engineer', email: 'john.doe@example.com', phone: '+1 555-0199', location: 'San Francisco, CA', link: 'linkedin.com/in/johndoe', github: 'github.com/johndoe' },
        summary: 'Innovative and results-driven Software Engineer with 8+ years of experience designing, building, and deploying robust web applications. Expertise in cloud architectures, microservices, and modern frontend technologies.',
        experience: [
          { company: 'Global Tech Solutions', role: 'Lead Software Engineer', start: 'Jan 2021', end: 'Present', bullets: 'Led a team of 6 engineers to rebuild the core legacy platform in Node.js & React, improving throughput by 45%.\nArchitected and deployed AWS serverless APIs reducing operational costs by 30%.' },
          { company: 'Innovate Corp', role: 'Senior Developer', start: 'Mar 2018', end: 'Dec 2020', bullets: 'Developed high-performance client dashboards, increasing user engagement by 20%.\nMentored junior developers and established code review best practices.' }
        ],
        education: [
          { school: 'Stanford University', degree: 'M.S. Computer Science', start: '2016', end: '2018' },
          { school: 'UC Berkeley', degree: 'B.S. Electrical Engineering & Computer Science', start: '2012', end: '2016' }
        ],
        projects: [
          { name: 'OpenSource Cloud Deployer', description: 'A CLI tool that provisions containerized services to multi-cloud clusters in under 2 minutes.', date: '2023' }
        ],
        skills: 'JavaScript, TypeScript, React, Node.js, AWS, Docker, Kubernetes, SQL, Git, REST APIs',
        certifications: 'AWS Certified Solutions Architect (2023), Certified CKA (2022)',
        languages: [
          { language: 'English', proficiency: 'Native' },
          { language: 'Spanish', proficiency: 'Conversational' }
        ],
        sectionOrder: ['personal', 'summary', 'experience', 'education', 'projects', 'skills', 'certifications', 'languages'],
        styling: { font: 'sans', spacing: 1.4 }
      };
    }

    loadTemplates();
  </script>
</body>
</html>
