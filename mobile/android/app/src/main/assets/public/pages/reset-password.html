<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/auth.css">
<style>
  .criteria-list {
    margin-top: var(--sp-3);
    margin-bottom: var(--sp-4);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .criteria-item {
    font-size: 11px;
    color: var(--ink-600);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 0.2s;
  }
  .criteria-item.valid {
    color: var(--score-high);
  }
  .criteria-item i {
    font-size: 10px;
    width: 14px;
    text-align: center;
  }
  .criteria-item.valid i {
    color: var(--score-high);
  }
</style>

<title>Reset Password — ResumeForge</title>
<meta name="description" content="Set a new password for your ResumeForge account.">
<link rel="canonical" href="https://ai-resume-builder-rb1m.onrender.com/pages/reset-password.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Reset Password — ResumeForge">
<meta property="og:description" content="Set a new password for your ResumeForge account.">
<meta property="og:url" content="https://ai-resume-builder-rb1m.onrender.com/pages/reset-password.html">
<meta property="og:site_name" content="ResumeForge">
<meta property="og:image" content="https://ai-resume-builder-rb1m.onrender.com/assets/images/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Reset Password — ResumeForge">
<meta name="twitter:description" content="Set a new password for your ResumeForge account.">
<meta name="twitter:image" content="https://ai-resume-builder-rb1m.onrender.com/assets/images/og-image.jpg">
<link rel="icon" href="/favicon.ico">
</head>
<body>

<div class="auth-shell">
  <section class="auth-form-wrap">
    <div class="auth-form-inner">
      <a href="../index.html" class="brand" style="justify-content: center; margin-bottom: var(--sp-5);"><span class="brand-mark">RF</span>ResumeForge</a>
      <h1>Reset Password</h1>
      <p class="sub">Enter your new password</p>

      <div class="form-error" id="formError"><i class="fa-solid fa-circle-exclamation"></i><span></span></div>
      <div class="form-success" id="formSuccess"><i class="fa-solid fa-circle-check"></i><span>Password reset successfully. Redirecting to login...</span></div>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="newPassword">New Password</label>
          <div style="position:relative">
            <input type="password" id="newPassword" name="newPassword" placeholder="••••••••" required autocomplete="new-password" style="padding-right:46px">
            <button type="button" id="togglePw1" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ink-400);cursor:pointer;padding:0;font-size:14px;" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye" id="eyeIcon1"></i>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm New Password</label>
          <div style="position:relative">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required autocomplete="new-password" style="padding-right:46px">
            <button type="button" id="togglePw2" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ink-400);cursor:pointer;padding:0;font-size:14px;" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye" id="eyeIcon2"></i>
            </button>
          </div>
        </div>

        <div class="criteria-list">
          <div class="criteria-item" id="ruleLength"><i class="fa-regular fa-circle"></i> At least 8 characters</div>
          <div class="criteria-item" id="ruleNumber"><i class="fa-regular fa-circle"></i> Contains number</div>
          <div class="criteria-item" id="ruleUpper"><i class="fa-regular fa-circle"></i> Contains uppercase letter</div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-bottom: var(--sp-4);" id="resetSubmit">Reset Password</button>
      </form>

      <p class="auth-switch"><a href="login.html" class="btn-text">Back to Login</a></p>
    </div>
  </section>
</div>

<script src="../js/services/api-service.js"></script>
<script>
// Toggle visibility
document.getElementById('togglePw1').addEventListener('click', () => {
  const input = document.getElementById('newPassword');
  const icon  = document.getElementById('eyeIcon1');
  const show  = input.type === 'password';
  input.type = show ? 'text' : 'password';
  icon.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
});

document.getElementById('togglePw2').addEventListener('click', () => {
  const input = document.getElementById('confirmPassword');
  const icon  = document.getElementById('eyeIcon2');
  const show  = input.type === 'password';
  input.type = show ? 'text' : 'password';
  icon.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
});

// Extract token from query params
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

const errorBox = document.getElementById('formError');
const successBox = document.getElementById('formSuccess');
const submitBtn = document.getElementById('resetSubmit');

if (!token) {
  errorBox.querySelector('span').textContent = 'Invalid or missing password reset token.';
  errorBox.classList.add('is-visible');
  submitBtn.disabled = true;
}

// Password rules live checks
const newPw = document.getElementById('newPassword');
const ruleLength = document.getElementById('ruleLength');
const ruleNumber = document.getElementById('ruleNumber');
const ruleUpper = document.getElementById('ruleUpper');

function updateCheck(item, isValid) {
  if (isValid) {
    item.classList.add('valid');
    item.querySelector('i').className = 'fa-solid fa-circle-check';
  } else {
    item.classList.remove('valid');
    item.querySelector('i').className = 'fa-regular fa-circle';
  }
}

newPw.addEventListener('input', () => {
  const v = newPw.value;
  updateCheck(ruleLength, v.length >= 8);
  updateCheck(ruleNumber, /\d/.test(v));
  updateCheck(ruleUpper, /[A-Z]/.test(v));
});

// Submit Form
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('is-visible');
  successBox.classList.remove('is-visible');

  const password = newPw.value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (password.length < 8 || !/\d/.test(password) || !/[A-Z]/.test(password)) {
    errorBox.querySelector('span').textContent = 'Please meet all password criteria.';
    errorBox.classList.add('is-visible');
    return;
  }

  if (password !== confirmPassword) {
    errorBox.querySelector('span').textContent = 'Passwords do not match.';
    errorBox.classList.add('is-visible');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Resetting…';

  try {
    await ApiService.auth.resetPassword(token, password);
    successBox.classList.add('is-visible');
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 1500);
  } catch (err) {
    errorBox.querySelector('span').textContent = err.message || 'Could not reset password. Please request another reset.';
    errorBox.classList.add('is-visible');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Reset Password';
  }
});
</script>
</body>
</html>
