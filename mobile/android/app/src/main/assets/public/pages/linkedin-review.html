<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Styles -->
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/app-shell.css">
<link rel="stylesheet" href="../css/animations.css">
<style>
.reviewer-layout {
  display: grid;
  grid-template-columns: 1.2fr 1.8fr;
  gap: var(--sp-5);
  align-items: start;
}
@media (max-width: 1024px) {
  .reviewer-layout {
    grid-template-columns: 1fr;
  }
}
.li-card {
  background: var(--paper-0);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--sp-5);
  box-shadow: var(--shadow-sm);
}
.score-circle-container {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: var(--sp-4);
}
.score-circle {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 6px solid var(--line);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}
.score-circle .val {
  font-size: var(--fs-xl);
  font-weight: 800;
  color: var(--ink-950);
}
.score-circle .label {
  font-size: var(--fs-3xs);
  text-transform: uppercase;
  color: var(--ink-600);
  font-weight: 700;
}
.review-item {
  border-bottom: 1px solid var(--line);
  padding: var(--sp-4) 0;
}
.review-item:last-child {
  border-bottom: none;
}
.review-item h4 {
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--ink-950);
  margin-bottom: var(--sp-2);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
.review-item h4 i {
  color: var(--primary);
}
.review-item p {
  color: var(--ink-700);
  font-size: var(--fs-xs);
  line-height: 1.5;
}
.chip-container {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin-top: var(--sp-2);
}
.keyword-chip {
  font-size: var(--fs-3xs);
  padding: 4px 10px;
  background: var(--paper-50);
  color: var(--ink-800);
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  font-weight: 700;
}
.empty-results {
  text-align: center;
  padding: var(--sp-8) var(--sp-4);
  color: var(--ink-600);
}
.empty-results i {
  font-size: var(--fs-2xl);
  margin-bottom: var(--sp-3);
  color: var(--ink-400);
}
</style>

<title>LinkedIn Reviewer — ResumeForge</title>
<meta name="description" content="Get your LinkedIn profile reviewed by AI.">
<link rel="canonical" href="https://ai-resume-builder-rb1m.onrender.com/pages/linkedin-review.html">
<meta property="og:type" content="website">
<meta property="og:title" content="LinkedIn Reviewer — ResumeForge">
<meta property="og:description" content="Get your LinkedIn profile reviewed by AI.">
<meta property="og:url" content="https://ai-resume-builder-rb1m.onrender.com/pages/linkedin-review.html">
<meta property="og:site_name" content="ResumeForge">
<meta property="og:image" content="https://ai-resume-builder-rb1m.onrender.com/assets/images/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="LinkedIn Reviewer — ResumeForge">
<meta name="twitter:description" content="Get your LinkedIn profile reviewed by AI.">
<meta name="twitter:image" content="https://ai-resume-builder-rb1m.onrender.com/assets/images/og-image.jpg">
<link rel="icon" href="/favicon.ico">
</head>
<body>

<div id="appShellRoot"></div>

<template id="linkedinTemplate">
  <div class="reviewer-layout">
    <!-- Input Panel -->
    <div class="li-card">
      <h3>LinkedIn Profile Audit</h3>
      <p class="sub" style="margin-bottom:var(--sp-4)">Paste your LinkedIn headline, summary, and experience sections to review alignment, search visibility, and professional recruiter impact.</p>
      
      <div class="field">
        <label for="profileText">Profile Bio / Experience Text</label>
        <textarea id="profileText" rows="12" placeholder="Jane Doe&#10;Headline: Senior Software Engineer at TechCorp&#10;&#10;About:&#10;Passionate builder specializing in web development...&#10;&#10;Experience:&#10;- Led engineering for analytics dashboard..."></textarea>
      </div>
      
      <div id="liErrorBox" class="scan-error-box" style="display:none; color:var(--score-low); margin-bottom:var(--sp-3)"></div>
      
      <button class="btn btn-primary btn-block btn-lg" id="btnAudit"><i class="fa-brands fa-linkedin"></i> Audit Profile</button>
    </div>

    <!-- Output Panel -->
    <div class="li-card" id="resultsPanel">
      <div class="empty-results">
        <i class="fa-solid fa-list-check"></i>
        <h3>Awaiting profile audit</h3>
        <p>Enter your profile text on the left and click Audit Profile to run our AI analysis scanner.</p>
      </div>
    </div>
  </div>
</template>

<script src="../js/services/api-service.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/components/app-shell.js"></script>
<script>
AppShell.render({ active: 'linkedin-review', title: 'LinkedIn Profile Auditor' });
const content = document.getElementById('appContent');
content.appendChild(document.getElementById('linkedinTemplate').content.cloneNode(true));
</script>
<script src="../js/pages/linkedin-review.js"></script>
<a href="../index.html" class="global-back-btn" aria-label="Back to Home" title="Back to Home"><i class="fa-solid fa-house"></i></a>
</body>
</html>
